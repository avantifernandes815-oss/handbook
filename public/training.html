<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Training · Momence SDR Handbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap">
<link rel="stylesheet" href="/cert-pages.css">
<style>
.tr-sec{margin-bottom:26px}
.tr-num{font-size:11px;letter-spacing:1px;color:var(--purple);font-weight:700}
.tr-sec h2{font-family:Nunito,Arial,sans-serif;font-size:21px;margin:4px 0 6px}
.tr-sec>p{font-size:14px;color:var(--body);margin:0 0 14px;line-height:1.6}
.tr-tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tr-tbl th{text-align:left;font-size:11px;letter-spacing:.6px;color:var(--sub);background:var(--page);padding:10px 12px;text-transform:uppercase}
.tr-tbl td{padding:11px 12px;border-top:1px solid var(--line);vertical-align:top;line-height:1.45}
.tr-tbl td:first-child{font-weight:700}
.tr-scroll{overflow-x:auto}
.tr-int{background:#f6f3ff;border:1px solid #e3dcff;border-radius:16px;padding:18px 20px;margin-top:14px}
.tr-int .k{font-size:11px;letter-spacing:1px;color:var(--purple);font-weight:700}
.tr-slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
.tr-slot{border:2px dashed #cfc6f5;border-radius:12px;padding:10px;font-size:12px;color:var(--sub);min-height:58px;background:var(--paper)}
.tr-slot.filled{border-style:solid;border-color:var(--purple);color:var(--ink)}
.tr-card{display:inline-block;background:var(--paper);border:1px solid #d9d3f3;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:700;margin:4px 6px 0 0;cursor:pointer;font-family:inherit;color:var(--ink)}
.tr-card:hover{border-color:var(--purple)}
.tr-card.bad{border-color:#f0b4ae;background:#fdf1ef;color:#9b2c1f;text-decoration:line-through;cursor:default}
.tr-fb{border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px;line-height:1.5}
.tr-fb.ok{background:#eef8f2;border:1px solid #9bd3b5;color:#1f5c3c}
.tr-fb.no{background:#fdf1ef;border:1px solid #f0b4ae;color:#9b2c1f}
.tr-pick{display:inline-flex;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:13px;font-weight:700;margin:0 8px 8px 0;cursor:pointer;font-family:inherit;color:var(--ink)}
.tr-pick.right{border-color:#1f7a4d;background:#eef8f2;color:#1f7a4d}.tr-pick.wrong{border-color:#f0b4ae;background:#fdf1ef;color:#9b2c1f}
.tr-quote{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0 12px}
.tr-quote .q{font-size:18px;font-weight:700;margin-top:4px}
.tr-kill{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tr-kill div{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:13px}
.tr-kill b{display:block;color:#9b2c1f;font-size:14px}.tr-kill small{display:block;color:var(--sub);margin:4px 0 6px}
.tr-stat{display:flex;gap:16px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 20px}
.tr-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tr-stat .big{font-family:Nunito,Arial,sans-serif;font-size:30px;color:var(--purple);font-weight:800}
.tr-app{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:6px 20px}
.tr-row{display:grid;grid-template-columns:190px minmax(0,1fr);gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.tr-row:first-child{border-top:0}
.tr-row small{display:block;color:var(--sub);font-size:12px;margin-top:6px;line-height:1.4}
.tr-done{background:#eef8f2;border:1px solid #9bd3b5;border-radius:14px;padding:14px 18px;font-size:14px;color:#1f5c3c;margin-bottom:18px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.st-pills{display:flex;gap:8px;margin:16px 0 22px;flex-wrap:wrap}
.st-pills button{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:13px;font-weight:700;color:var(--sub);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.st-pills button:disabled{cursor:default;opacity:.55}
.st-pills i{width:20px;height:20px;border-radius:50%;background:#f2f1f6;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:11px}
.st-pills .on{border-color:var(--purple);color:var(--purple)}.st-pills .on i{background:var(--purple);color:#fff}
.st-pills .done{color:var(--ok)}.st-pills .done i{background:var(--ok-bg);color:var(--ok)}
.st-pills .lbl{display:none}.st-pills .on .lbl{display:inline}
.st-bar{display:none;height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:14px 0 16px}.st-bar i{display:block;height:100%;background:var(--purple)}
.st-card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:32px}
.st-k{font-size:11px;letter-spacing:1px;font-weight:700;color:var(--purple);text-transform:uppercase}
.st-card h2{font-family:Nunito,Arial,sans-serif;font-size:28px;line-height:1.15;margin:6px 0 10px}
.st-why{font-size:15px;color:var(--sub);margin:0 0 22px;line-height:1.55;max-width:62ch}
.st-idea{font-size:15px;color:var(--body);line-height:1.6;margin:0 0 18px;max-width:64ch}
.st-say{border:1px dashed var(--purple);border-radius:14px;padding:14px 16px;margin:0 0 20px;font-size:14px;line-height:1.5}
.st-say b{display:block;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--purple);margin-bottom:4px}
.st-tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.st-tabs button{font:inherit;font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--paper);color:var(--sub);cursor:pointer}
.st-tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.st-ex{background:var(--page);border-radius:14px;padding:16px 18px;font-size:14px;line-height:1.55;margin-bottom:26px}
.st-ex small{display:block;font-size:12px;color:var(--sub);margin-top:6px}
.st-ex.good{border-left:3px solid var(--ok)}.st-ex.missed{border-left:3px solid #b42318}
.st-check{border-top:1px solid var(--line);padding-top:22px}
.st-check h3{font-family:Nunito,Arial,sans-serif;font-size:17px;margin:0 0 4px}
.st-check .q{margin:0 0 14px;font-size:14px;color:var(--body);line-height:1.55}
.st-opts{display:grid;gap:8px}
.st-opt{display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;line-height:1.45}
.st-opt:hover:not(:disabled){border-color:var(--purple)}.st-opt:disabled{cursor:default}
.st-opt .lt{flex:0 0 24px;height:24px;border-radius:7px;background:var(--soft);color:var(--purple);font-weight:700;font-size:12px;display:grid;place-items:center}
.st-opt.right{border-color:var(--ok);background:var(--ok-bg)}.st-opt.right .lt{background:var(--ok);color:#fff}
.st-opt.wrong{border-color:#b42318;background:#fdecea}.st-opt.wrong .lt{background:#b42318;color:#fff}
.st-rev{margin-top:12px;padding:14px 16px;border-radius:12px;background:var(--soft);font-size:14px;line-height:1.5}.st-rev b{color:var(--purple)}
.st-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:26px;flex-wrap:wrap}
.st-back{font:inherit;font-size:14px;color:var(--sub);background:none;border:0;cursor:pointer;padding:8px 4px}
.st-hint{font-size:12px;color:var(--sub)}
.st-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:18px 0 24px}
.st-grid div{background:var(--page);border-radius:12px;padding:12px;font-size:13px}.st-grid b{display:block;font-size:11px;color:var(--purple)}
.st-facts{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-bottom:8px}.st-facts b{color:var(--ink)}
.st-score{font-family:Nunito,Arial,sans-serif;font-size:44px;color:var(--purple);font-weight:800;margin:4px 0}
@media (max-width:760px){.st-pills{display:none}.st-bar{display:block}.st-card{padding:22px}.st-card h2{font-size:23px}.st-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.tr-stats{grid-template-columns:1fr}.tr-slots{grid-template-columns:1fr 1fr}.tr-kill{grid-template-columns:1fr}.tr-row{grid-template-columns:1fr;gap:8px}}
</style>
</head>
<body>
<header>
  <div class="brand"><img src="/momence-logo.svg" alt="Momence"><span class="div"></span><b id="htitle">Training</b></div>
  <div class="status"><span id="saved"></span><a class="crumb" href="/#page=certifications">← Back to handbook</a></div>
</header>
<main><div class="wrap wide" id="app"><p class="center">Loading…</p></div></main>
<script>
(() => {
const cert = (location.pathname.match(/^\/training\/([A-Z0-9]{1,6})$/) || [])[1];
const app = document.getElementById('app'), saved = document.getElementById('saved');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path, body) {
  const r = await fetch(path, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(data.message || 'Something went wrong.'), data);
  return data;
}
let S = null, openers = [], timer = null;
const DEFAULT_FIELDS = [{key: 'business', label: 'Business', kind: 'input', required: true}, {key: 'note', label: 'SDR Additional Note', kind: 'input', required: true}, {key: 'opener', label: 'Your four-part opener', kind: 'textarea', placeholder: 'Their name, who you are, why them, a question back.', required: true}];
const fieldsOf = a => (a && a.fields) || DEFAULT_FIELDS;
function entryOk(a, o) { return fieldsOf(a).every(f => !f.required || (o[f.key] || '').trim().length >= (f.kind === 'textarea' ? (a.textMin || 20) : 1)); }
function appStatus(a) { const n = openers.filter(o => entryOk(a, o)).length, distinctOk = !a.distinct || new Set(openers.map(o => o[a.distinct]).filter(Boolean)).size >= (a.distinctMin || openers.length); return {n, ready: n === a.slots.length && distinctOk, distinctOk}; }
const build = {placed: [], bad: [], msg: null}, picks = {}, shown = {}, noteVals = {}, noteShown = {};
const tabOn = {};
const pickOf = k => picks[k] || (picks[k] = {i: 0, chosen: null});

async function load() {
  try { S = await api('/api/training/' + cert); }
  catch (e) { app.innerHTML = '<div class="card narrow" style="margin:0 auto"><h1>Not open yet</h1><p class="lead">' + esc(e.message) + '</p><a class="btn ghost" href="/#page=certifications">Back to my certifications</a></div>'; return; }
  document.getElementById('htitle').textContent = S.cert.id + ' · Training';
  const app0 = S.def.sections.find(x => x.type === 'application');
  openers = (app0?.slots || []).map((slot, i) => { const o = {type: slot.type}; for (const f of fieldsOf(app0)) o[f.key] = S.content.openers?.[i]?.[f.key] || ''; return o; });
  render();
}
function stepper() {
  const c = S.progress.components;
  const steps = [['Training', c.training === 'passed'], ['Quiz', c.quiz === 'passed'], ['Live roleplay', c.roleplay === 'passed']].filter(x => x[0] !== 'Live roleplay' || S.cert.components.includes('roleplay'));
  const on = steps.findIndex(x => !x[1]);
  return '<div class="cc-steps">' + steps.map((x, i) => '<span class="cc-step' + (x[1] ? ' done' : i === on ? ' on' : '') + '"><i>' + (x[1] ? '✓' : i + 1) + '</i>' + x[0] + '</span>').join('') + '</div>';
}
function table(sec) {
  return '<div class="tr-scroll"><table class="tr-tbl"><tr>' + sec.head.map(h => '<th>' + esc(h) + '</th>').join('') + '</tr>' + sec.rows.map(r => '<tr>' + r.map(c => '<td>' + esc(c) + '</td>').join('') + '</tr>').join('') + '</table></div>';
}
function head(sec) { return (sec.label ? '<div class="tr-num">' + esc(sec.label) + '</div>' : '') + (sec.title ? '<h2>' + esc(sec.title) + '</h2>' : '') + (sec.body ? '<p>' + esc(sec.body) + '</p>' : ''); }
function buildBox(sec) {
  const pool = [...sec.parts.map((t, i) => ({t, i})), ...sec.decoys.map((d, j) => ({t: d.text, d: j}))];
  const order = [3, 5, 0, 2, 4, 1].map(k => pool[k]).filter(Boolean);
  const done = build.placed.length === sec.parts.length;
  return '<div class="tr-int" id="buildbox"><div class="k">' + esc(sec.label) + '</div><div style="font-size:13px;margin-top:6px">' + esc(sec.prompt) + ' Tap the cards in order.</div>' +
    '<div class="tr-slots">' + sec.parts.map((_, i) => '<div class="tr-slot' + (build.placed[i] != null ? ' filled' : '') + '"><b>' + (i + 1) + '</b><br>' + (build.placed[i] != null ? esc(sec.parts[build.placed[i]]) : 'Tap a card') + '</div>').join('') + '</div>' +
    '<div>' + order.filter(x => x.i == null || !build.placed.includes(x.i)).map(x => x.d != null ? '<button type="button" class="tr-card' + (build.bad.includes(x.d) ? ' bad' : '') + '" data-decoy="' + x.d + '"' + (build.bad.includes(x.d) ? ' disabled' : '') + '>' + esc(x.t) + '</button>' : '<button type="button" class="tr-card" data-part="' + x.i + '">' + esc(x.t) + '</button>').join('') + '</div>' +
    (done ? '<div class="tr-fb ok">' + esc(sec.done || 'That’s the opener: name, who you are, why them, a question back. Under fifteen seconds.') + '</div>' : build.msg ? '<div class="tr-fb no">' + esc(build.msg) + '</div>' : '') +
    (done || build.placed.length ? '<p style="margin:10px 0 0"><button type="button" class="tr-pick" id="buildreset" style="margin:0">Start over</button></p>' : '') + '</div>';
}
function pickBox(sec, k) {
  const pick = pickOf(k), c = sec.cards[pick.i], ch = pick.chosen, opts = c.options || sec.options;
  return '<div class="tr-int" id="pickbox' + k + '"><div style="display:flex;justify-content:space-between"><div class="k">' + esc(sec.tryLabel || sec.label) + '</div><span class="sub" style="font-size:12px">Card ' + (pick.i + 1) + ' of ' + sec.cards.length + '</span></div>' +
    '<div class="tr-quote">' + (c.setup ? '<div class="sub" style="font-size:12px">' + esc(c.setup) + '</div>' : '') + '<div class="q">' + esc(c.line) + '</div></div>' + (c.options ? '<div style="display:grid;gap:8px">' : '') +
    opts.map(o => '<button type="button" class="tr-pick' + (ch ? (o === c.answer ? ' right' : o === ch ? ' wrong' : '') : '') + '" data-pick="' + esc(o) + '" data-pk="' + k + '"' + (ch ? ' disabled' : '') + '>' + esc(o) + (ch && o === c.answer ? ' ✓' : '') + '</button>').join('') + (c.options ? '</div>' : '') +
    (ch ? '<div class="tr-fb ' + (ch === c.answer ? 'ok">Right. ' : 'no">Not quite. ') + esc(c.why) + '</div>' + (c.layer ? '<div class="tr-fb ok" style="background:var(--paper)"><b>Next layer:</b> ' + esc(c.layer) + '</div>' : '') + '<p style="margin:10px 0 0"><button type="button" class="tr-pick" data-picknext="' + k + '" style="margin:0">' + (pick.i < sec.cards.length - 1 ? 'Next card →' : 'Start over') + '</button></p>' : '') + '</div>';
}
function writeBox(sec) {
  return '<div class="tr-int"><div class="k">' + esc(sec.tryLabel || 'TRY IT · WRITE PART 3') + '</div><div style="font-size:13px;margin-top:6px">' + esc(sec.tryLabel ? 'Write it for each card. Not graded.' : 'Write a part 3 for each note. Not graded.') + '</div>' +
    sec.notes.map((n, i) => '<div class="tr-quote" style="margin-top:12px"><div class="sub" style="font-size:11px;letter-spacing:.6px;font-weight:700">' + esc(sec.noteLabel || 'SDR ADDITIONAL NOTE') + '</div><div style="font-size:13px;margin:4px 0 10px">' + esc(n.note) + '</div><label class="fld" for="w' + i + '">' + esc(sec.writeLabel || 'Your part 3') + '</label><textarea class="in" rows="2" id="w' + i + '"></textarea>' +
      (shown[i] ? '<div class="tr-fb ok">A strong example: ' + esc(n.example) + '</div>' : '<p style="margin:8px 0 0"><button type="button" class="tr-pick" data-show="' + i + '" style="margin:0">Show a strong example</button></p>') + '</div>').join('') + '</div>';
}
function tabsBox(sec, k) {
  const on = tabOn[k] || 0, it = sec.items[on];
  return '<div id="tabs' + k + '"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px" role="tablist">' + sec.items.map((x, i) => '<button type="button" role="tab" aria-selected="' + (i === on) + '" class="tr-pick' + (i === on ? ' right' : '') + '" style="margin:0" data-tab="' + k + ':' + i + '">' + esc(x.name) + '</button>').join('') + '</div><div class="tr-app" style="padding:14px 20px">' + it.rows.map(r => '<div class="tr-row" style="grid-template-columns:200px minmax(0,1fr);padding:10px 0"><b style="font-size:13px">' + esc(r[0]) + '</b><span style="font-size:14px;line-height:1.55">' + esc(r[1]) + '</span></div>').join('') + '</div></div>';
}
function noteBox(sec, k) {
  const v = noteVals[k] || (noteVals[k] = sec.fields.map(() => '')), ready = v.every(x => x.trim().length >= (sec.min || 40));
  return '<div class="tr-int"><div class="k">' + esc(sec.tryLabel || 'TRY IT') + '</div><div class="tr-quote"><div class="sub" style="font-size:12px">' + esc(sec.setup) + '</div><div style="font-size:14px;line-height:1.6;margin-top:4px">' + esc(sec.excerpt) + '</div></div><div class="grid2">' +
    sec.fields.map((f, i) => '<div><label class="fld" for="nt' + k + '_' + i + '">' + esc(f.label) + '</label><textarea class="in" rows="3" id="nt' + k + '_' + i + '" data-nk="' + k + '" data-ni="' + i + '" maxlength="600">' + esc(v[i]) + '</textarea>' + (noteShown[k] ? '<div class="tr-fb ok" style="margin-top:6px"><b>Model:</b> ' + esc(f.model) + '</div>' : '') + '</div>').join('') + '</div>' +
    '<p style="margin:12px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap" id="ntbar' + k + '">' + noteBar(sec, k, ready) + '</p></div>';
}
function noteBar(sec, k, ready) {
  return noteShown[k] ? '<span class="sub" style="font-size:12px">Model note shown under each field.</span>' : ready ? '<button type="button" class="tr-pick" data-ntshow="' + k + '" style="margin:0">Compare with a model note</button>' : '<span class="sub" style="font-size:12px">Write ' + (sec.min || 40) + '+ characters in each field to compare with a model note.</span>';
}
function fieldHtml(f, i, val) {
  const id = 'a' + f.key + i, attrs = ' id="' + id + '" data-i="' + i + '" data-f="' + f.key + '"';
  if (f.kind === 'select') return '<div><label class="fld" for="' + id + '">' + esc(f.label) + '</label><select class="in"' + attrs + '><option value="">Pick one</option>' + f.options.map(o => '<option' + (o === val ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select></div>';
  if (f.kind === 'textarea') return '<div style="grid-column:1/-1"><label class="fld" for="' + id + '">' + esc(f.label) + '</label><textarea class="in" rows="2"' + attrs + ' maxlength="1200" placeholder="' + esc(f.placeholder || '') + '">' + esc(val) + '</textarea></div>';
  return '<div><label class="fld" for="' + id + '">' + esc(f.label) + '</label><input class="in"' + attrs + ' maxlength="600" value="' + esc(val) + '"></div>';
}
function appNote(sec) {
  const st = appStatus(sec);
  if (S.completedAt) return 'Saved. These come with you to the roleplay.';
  return 'Saved as you type · ' + st.n + ' of ' + sec.slots.length + ' ' + (sec.doneWord || 'written') + (sec.distinct && st.n === sec.slots.length && !st.distinctOk ? ' · pick ' + sec.distinctMin + ' different ' + sec.distinct + 's' : '');
}
function appBox(sec) {
  const fields = fieldsOf(sec);
  return '<div class="tr-app">' + sec.slots.map((slot, i) => '<div class="tr-row"><div><span class="chip go">' + esc(slot.type) + '</span><small>' + esc(slot.hint) + '</small></div><div class="grid2">' + fields.map(f => fieldHtml(f, i, openers[i][f.key] || '')).join('') + '</div></div>').join('') + '</div>' +
    '<section class="bar-foot" style="margin-top:16px"><div class="note" id="appnote">' + esc(appNote(sec)) + '</div><div>' + nextBtn(appStatus(sec).ready) + '</div></section><p class="err" id="err" role="alert"></p>';
}
function nextBtn(ready) {
  const c = S.progress.components;
  if (S.completedAt) return c.quiz === 'passed' ? '<a class="btn inline" href="/roleplay/' + cert + '">Go to your roleplay</a>' : '<a class="btn inline" href="/quiz/' + cert + '">Go to the ' + esc(cert) + ' quiz</a>';
  const a = sec('application'), what = a && a.unit ? a.unit : a && a.fields ? 'pitches' : 'openers';
  return ready ? '<button class="btn inline" id="finish">Finish training &amp; start the quiz</button>' : '<span class="locked-btn">' + (a && a.unitVerb || 'Write') + ' all ' + (a ? a.slots.length : 3) + ' ' + what + ' to unlock the quiz</span>';
}
function render() {
  const preview = S.missingPrereqs.length && S.canPreview;
  if (S.missingPrereqs.length && !preview) {
    app.innerHTML = '<a class="crumb" href="/#page=certifications">← Your path</a><div class="eyebrow" style="margin-top:14px">' + esc(S.cert.id) + '</div><h1>' + esc(S.def.title) + '</h1><section class="panel"><h2>Not unlocked yet</h2><p class="sub" style="font-size:14px">' + (S.missingPrereqs.includes('Senior SDR') ? 'The Junior AE track opens once your manager marks you Senior SDR.' : 'Pass ' + esc(S.missingPrereqs.join(', ')) + ' first.') + '</p></section>';
    return;
  }
  const label = {cold_calling: 'COLD CALLING', skills: 'SKILLS', foundation: 'FOUNDATION', junior_ae: 'JUNIOR AE TRACK'}[S.cert.track] || '';
  if (S.def.format === 'steps') return renderSteps(label, preview);
  let html = '<a class="crumb" href="/#page=certifications">← Your path</a><div class="eyebrow" style="margin-top:14px">' + label + ' · ' + esc(S.cert.id) + '</div><h1>' + esc(S.def.title) + '</h1><p class="intro">' + esc(S.def.summary) + '</p>' + stepper();
  if (preview) html += '<div class="tr-done" style="background:#fff8e6;border-color:#f3dfa8;color:#5c4400"><span><b>Manager preview.</b> This is the page as a rep sees it. Your own path hasn’t unlocked it, so nothing here saves.</span></div>';
  if (S.completedAt) html += '<div class="tr-done"><span><b>Training done.</b> You can come back to it any time.</span>' + nextBtn(true) + '</div>';
  S.def.sections.forEach((sec, si) => {
    if (sec.type === 'why' && sec.quote) html += '<section class="tr-sec">' + head(sec) + '<div class="tr-stat" style="border-left:4px solid var(--purple);font-size:15px;font-weight:700">' + esc(sec.quote) + '</div></section>';
    else if (sec.type === 'why') html += '<section class="tr-sec">' + head(sec) + '<div class="tr-stat"><div class="big">' + esc(sec.stat.big) + '</div><div style="font-size:14px"><b>' + esc(sec.stat.line) + '</b><br><span class="sub" style="font-size:12px">' + esc(sec.stat.sub) + '</span></div></div></section>';
    else if (sec.type === 'stats') html += '<section class="tr-sec">' + head(sec) + '<div class="tr-stats">' + sec.stats.map(x => '<div class="tr-stat"><div class="big">' + esc(x.big) + '</div><div style="font-size:14px"><b>' + esc(x.line) + '</b><br><span class="sub" style="font-size:12px">' + esc(x.sub) + '</span></div></div>').join('') + '</div></section>';
    else if (sec.type === 'table') html += '<section class="tr-sec">' + head(sec) + table(sec) + (sec.after ? '<p style="font-size:13px;color:var(--body);margin:10px 0 0">' + esc(sec.after) + '</p>' : '') + '</section>';
    else if (sec.type === 'build') html += '<section class="tr-sec" style="margin-top:-12px">' + buildBox(sec) + '</section>';
    else if (sec.type === 'pickup') html += '<section class="tr-sec"' + (sec.title ? '>' + head(sec) : ' style="margin-top:-12px">') + pickBox(sec, si) + '</section>';
    else if (sec.type === 'cards') html += '<section class="tr-sec">' + head(sec) + '<div class="tr-kill">' + sec.items.map(k => '<div><b style="color:var(--ink)">' + esc(k.title) + '</b><small>' + esc(k.sub) + '</small><span>' + esc(k.quote) + '</span></div>').join('') + '</div>' + (sec.after ? '<div class="tr-int" style="padding:12px 16px;font-size:13px"><b>' + esc(sec.after.split(':')[0]) + ':</b>' + esc(sec.after.slice(sec.after.indexOf(':') + 1)) + '</div>' : '') + '</section>';
    else if (sec.type === 'tabs') html += '<section class="tr-sec">' + head(sec) + tabsBox(sec, si) + '</section>';
    else if (sec.type === 'note') html += '<section class="tr-sec">' + head(sec) + noteBox(sec, si) + '</section>';
    else if (sec.type === 'write') html += '<section class="tr-sec">' + head(sec) + table(sec) + writeBox(sec) + '</section>';
    else if (sec.type === 'killers') html += '<section class="tr-sec">' + head(sec) + '<div class="tr-kill">' + sec.items.map(k => '<div><b>' + esc(k[0]) + '</b><small>' + esc(k[1]) + '</small><span><b style="display:inline;color:var(--ink);font-size:13px">Instead:</b> ' + esc(k[2]) + '</span></div>').join('') + '</div></section>';
    else if (sec.type === 'text') html += '<section class="tr-sec">' + head(sec) + '</section>';
    else if (sec.type === 'application') html += '<section class="tr-sec" id="appsec">' + head(sec) + (preview ? '<div class="tr-app" style="padding:16px 20px">' + sec.slots.map(sl => '<p style="margin:6px 0;font-size:13px"><span class="chip go">' + esc(sl.type) + '</span> ' + esc(sl.hint) + '</p>').join('') + '</div>' : appBox(sec)) + '</section>';
  });
  const writes = [...app.querySelectorAll('[id^="w"]')].map(t => t.value);
  app.innerHTML = html;
  writes.forEach((v, i) => { const t = document.getElementById('w' + i); if (t) t.value = v; });
  wire();
}
function sec(type) { return S.def.sections.find(x => x.type === type); }
function rerender(id, fn) { const el = document.getElementById(id); if (el) { el.outerHTML = fn(); wire(); } }
function wire() {
  const b = sec('build'), a = sec('application');
  app.querySelectorAll('[data-part]').forEach(x => x.onclick = () => {
    const i = +x.dataset.part, next = build.placed.length;
    if (i === next) { build.placed.push(i); build.msg = null; } else build.msg = 'Not yet. What has to come before that?';
    rerender('buildbox', () => buildBox(b));
  });
  app.querySelectorAll('[data-decoy]').forEach(x => x.onclick = () => { const j = +x.dataset.decoy; build.bad.push(j); build.msg = b.decoys[j].text + ' doesn’t belong: ' + b.decoys[j].why.charAt(0).toLowerCase() + b.decoys[j].why.slice(1); rerender('buildbox', () => buildBox(b)); });
  const br = document.getElementById('buildreset'); if (br) br.onclick = () => { build.placed = []; build.bad = []; build.msg = null; rerender('buildbox', () => buildBox(b)); };
  app.querySelectorAll('[data-pick]').forEach(x => x.onclick = () => { const k = +x.dataset.pk; pickOf(k).chosen = x.dataset.pick; rerender('pickbox' + k, () => pickBox(S.def.sections[k], k)); });
  app.querySelectorAll('[data-picknext]').forEach(x => x.onclick = () => { const k = +x.dataset.picknext, ps = S.def.sections[k], pk = pickOf(k); pk.i = (pk.i + 1) % ps.cards.length; pk.chosen = null; rerender('pickbox' + k, () => pickBox(ps, k)); });
  app.querySelectorAll('[data-tab]').forEach(x => x.onclick = () => { const [k, i] = x.dataset.tab.split(':').map(Number); tabOn[k] = i; rerender('tabs' + k, () => tabsBox(S.def.sections[k], k)); });
  app.querySelectorAll('[data-nk]').forEach(el => el.oninput = () => { const k = +el.dataset.nk, ns = S.def.sections[k]; noteVals[k][+el.dataset.ni] = el.value; const bar = document.getElementById('ntbar' + k); bar.innerHTML = noteBar(ns, k, noteVals[k].every(x => x.trim().length >= (ns.min || 40))); wire(); });
  app.querySelectorAll('[data-ntshow]').forEach(x => x.onclick = () => { noteShown[x.dataset.ntshow] = true; render(); });
  app.querySelectorAll('[data-show]').forEach(x => x.onclick = () => { shown[x.dataset.show] = true; render(); });
  app.querySelectorAll('[data-f]').forEach(el => el[el.tagName === 'SELECT' ? 'onchange' : 'oninput'] = () => {
    openers[+el.dataset.i][el.dataset.f] = el.value;
    const note = document.getElementById('appnote'); if (note && !S.completedAt) note.textContent = 'Saving… · ' + appNote(a).replace(/^Saved as you type · /, '');
    const box = note?.parentElement?.lastElementChild; if (box && !S.completedAt) { box.innerHTML = nextBtn(appStatus(a).ready); const f = document.getElementById('finish'); if (f) f.onclick = finish; }
    clearTimeout(timer); timer = setTimeout(save, 800);
  });
  const f = document.getElementById('finish'); if (f) f.onclick = finish;
}
async function save() {
  try { const r = await api('/api/training/' + cert, {content: {openers}}); S.completedAt = r.completedAt; saved.textContent = 'Saved'; const note = document.getElementById('appnote'); if (note && !S.completedAt) note.textContent = appNote(sec('application')); }
  catch (e) { saved.textContent = 'Not saved: ' + e.message; }
}
async function finish() {
  const b = document.getElementById('finish'); b.disabled = true; b.textContent = 'Saving…'; clearTimeout(timer);
  try { S = await api('/api/training/' + cert, {content: {openers}, complete: true}); location.href = '/quiz/' + cert; }
  catch (e) { b.disabled = false; b.textContent = 'Finish training & start the quiz'; document.getElementById('err').textContent = e.message; }
}
// ---------- step format (Junior AE track): one idea per screen, a quick check on each ----------
const ST = {i: -1, checks: null, tab: {}};
function stepsDone() { return ST.checks.filter(v => v !== null).length; }
function firstOpen() { const k = ST.checks.findIndex(v => v === null); return S.completedAt || k < 0 ? S.def.steps.length - 1 : k; }
function renderSteps(label, preview) {
  const D = S.def, N = D.steps.length;
  if (!ST.checks) { const saved = S.content.checks || []; ST.checks = D.steps.map((_, k) => Number.isInteger(saved[k]) ? saved[k] : null); }
  let html = '<a class="crumb" href="/#page=certifications">← Your path</a><div class="eyebrow" style="margin-top:14px">' + label + ' · ' + esc(S.cert.id) + '</div><h1>' + esc(D.title) + '</h1><p class="intro">Eight short steps with a quick check on each. About ' + esc(D.minutes || 12) + ' minutes.</p>';
  if (preview) html += '<div class="tr-done" style="background:#fff8e6;border-color:#f3dfa8;color:#5c4400"><span><b>Manager preview.</b> This is the page as a rep sees it. Your own path hasn’t unlocked it, so nothing here saves.</span></div>';
  if (S.completedAt) html += '<div class="tr-done"><span><b>Training done.</b> You can come back to it any time.</span>' + nextBtn(true) + '</div>';
  html += '<nav class="st-pills" aria-label="Steps">' + D.steps.map((st, k) => { const done = ST.checks[k] !== null && k !== ST.i, open = k <= firstOpen(); return '<button type="button" data-step="' + k + '" class="' + (k === ST.i ? 'on' : done ? 'done' : '') + '"' + (open ? '' : ' disabled') + ' title="' + esc(st.title) + '"><i>' + (done ? '✓' : k + 1) + '</i><span class="lbl">' + esc(st.title) + '</span></button>'; }).join('') + '</nav>';
  html += '<div class="st-bar" aria-hidden="true"><i style="width:' + Math.round(stepsDone() / N * 100) + '%"></i></div><section class="st-card" aria-live="polite">' + (ST.i < 0 ? stepIntro() : ST.i >= N ? stepEnd() : stepView(ST.i)) + '</section><p class="err" id="err" role="alert"></p>';
  app.innerHTML = html;
  app.querySelectorAll('[data-step]').forEach(b => b.onclick = () => goStep(+b.dataset.step));
  app.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => answer(+b.dataset.opt, preview));
  app.querySelectorAll('[data-ex]').forEach(b => b.onclick = () => { ST.tab[ST.i] = b.dataset.ex; render(); });
  const nx = document.getElementById('stnext'), bk = document.getElementById('stback'), fin = document.getElementById('finish');
  if (nx) nx.onclick = () => goStep(ST.i + 1);
  if (bk) bk.onclick = () => goStep(ST.i >= N ? N - 1 : ST.i - 1);
  if (fin) fin.onclick = preview ? () => { document.getElementById('err').textContent = 'Preview only. Reps finish here and go to the quiz.'; } : finishSteps;
}
function goStep(k) { ST.i = Math.max(-1, Math.min(S.def.steps.length, k)); render(); window.scrollTo(0, 0); }
function stepIntro() {
  const D = S.def;
  return '<div class="st-k">Mandatory · Junior AE track</div><h2>' + esc(D.title) + '</h2><p class="st-why">' + esc(D.summary) + '</p>' +
    '<div class="st-facts"><span><b>' + esc(D.minutes || 12) + '</b> minutes</span><span><b>' + D.steps.length + '</b> quick checks</span><span>Then a <b>' + esc(S.quiz?.questions || 10) + '-question</b> quiz</span></div>' +
    '<div class="st-grid">' + D.steps.map((x, k) => '<div><b>' + String(k + 1).padStart(2, '0') + '</b>' + esc(x.title) + '</div>').join('') + '</div>' +
    '<div class="st-foot"><span class="st-hint">Quick checks don’t count toward your score.</span><button class="btn inline" id="stnext">' + (stepsDone() && !S.completedAt ? 'Continue where you left off' : 'Start step 1') + '</button></div>';
}
function stepView(k) {
  const st = S.def.steps[k], N = S.def.steps.length, ans = ST.checks[k], tab = ST.tab[k] || 'good', ex = st[tab];
  const L = 'ABCD';
  return '<div class="st-k">Step ' + (k + 1) + ' of ' + N + '</div><h2>' + esc(st.title) + '</h2><p class="st-why">' + esc(st.why) + '</p><p class="st-idea">' + esc(st.idea) + '</p>' +
    '<div class="st-say"><b>Try saying</b>' + esc(st.say) + '</div>' +
    '<div class="st-tabs" role="tablist"><button type="button" role="tab" aria-selected="' + (tab === 'good') + '" class="' + (tab === 'good' ? 'on' : '') + '" data-ex="good">Done well</button><button type="button" role="tab" aria-selected="' + (tab === 'missed') + '" class="' + (tab === 'missed' ? 'on' : '') + '" data-ex="missed">Missed</button></div>' +
    '<div class="st-ex ' + tab + '">' + esc(ex.text) + '<small>From our demos · ' + esc(ex.source) + '</small></div>' +
    '<div class="st-check"><h3>Quick check</h3><p class="q">' + esc(st.check.prompt) + '</p><div class="st-opts">' +
    st.check.options.map((o, j) => '<button type="button" class="st-opt' + (ans === null ? '' : j === st.check.answer ? ' right' : j === ans ? ' wrong' : '') + '" data-opt="' + j + '"' + (ans === null ? '' : ' disabled') + '><span class="lt">' + L[j] + '</span><span>' + esc(o) + '</span></button>').join('') + '</div>' +
    (ans === null ? '' : '<div class="st-rev"><b>' + (ans === st.check.answer ? 'Right.' : 'Not quite.') + '</b> ' + esc(st.check.why) + '</div>') + '</div>' +
    '<div class="st-foot"><button type="button" class="st-back" id="stback">← Back</button><span class="st-hint">' + (ans === null ? 'Answer the quick check to continue' : '') + '</span><button class="btn inline" id="stnext"' + (ans === null ? ' disabled' : '') + '>' + (k === N - 1 ? 'Finish the steps' : 'Next step') + '</button></div>';
}
function stepEnd() {
  const D = S.def, right = D.steps.filter((st, k) => ST.checks[k] === st.check.answer).length;
  return '<div class="st-k">Steps complete</div><h2>Ready for the ' + esc(S.cert.id) + ' quiz</h2><div class="st-score">' + right + '/' + D.steps.length + '</div><p class="st-why">Quick checks right. These don’t count. ' + esc(D.quizNote || '') + '</p>' +
    '<div class="st-foot"><button type="button" class="st-back" id="stback">← Review steps</button>' + (S.completedAt ? nextBtn(true) : '<button class="btn inline" id="finish">Finish training &amp; start the quiz</button>') + '</div>';
}
async function answer(j, preview) {
  if (ST.checks[ST.i] !== null) return;
  ST.checks[ST.i] = j; render();
  if (preview) return;
  try { const r = await api('/api/training/' + cert, {content: {checks: ST.checks}}); S.completedAt = r.completedAt; saved.textContent = 'Saved'; }
  catch (e) { saved.textContent = 'Not saved: ' + e.message; }
}
async function finishSteps() {
  const b = document.getElementById('finish'); b.disabled = true; b.textContent = 'Saving…';
  try { await api('/api/training/' + cert, {content: {checks: ST.checks}, complete: true}); location.href = '/quiz/' + cert; }
  catch (e) { b.disabled = false; b.textContent = 'Finish training & start the quiz'; document.getElementById('err').textContent = e.message; }
}
if (!cert) app.innerHTML = '<p class="center">Not found.</p>'; else load();
})();
</script>
