g", "thumb": "slides/day-06-slide-05-thumb.jpg", "title": "Acknowledge → Disarm → Add Value → Ask"}, {"src": "slides/day-06-slide-06.jpg", "thumb": "slides/day-06-slide-06-thumb.jpg", "title": "Show them you actually heard it"}, {"src": "slides/day-06-slide-07.jpg", "thumb": "slides/day-06-slide-07-thumb.jpg", "title": "Break the buyer script"}, {"src": "slides/day-06-slide-08.jpg", "thumb": "slides/day-06-slide-08-thumb.jpg", "title": "Give them a reason to keep going"}, {"src": "slides/day-06-slide-09.jpg", "thumb": "slides/day-06-slide-09-thumb.jpg", "title": "Give the conversation somewhere to go"}, {"src": "slides/day-06-slide-10.jpg", "thumb": "slides/day-06-slide-10-thumb.jpg", "title": "How it sounds as one conversation"}, {"src": "slides/day-06-slide-11.jpg", "thumb": "slides/day-06-slide-11-thumb.jpg", "title": "The framework holds. The words don't."}, {"src": "slides/day-06-slide-12.jpg", "thumb": "slides/day-06-slide-12-thumb.jpg", "title": "Redirect, don't debate"}, {"src": "slides/day-06-slide-13.jpg", "thumb": "slides/day-06-slide-13-thumb.jpg", "title": "Know when to keep going"}, {"src": "slides/day-06-slide-14.jpg", "thumb": "slides/day-06-slide-14-thumb.jpg", "title": "Build the response, out loud"}, {"src": "slides/day-06-slide-15.jpg", "thumb": "slides/day-06-slide-15-thumb.jpg", "title": "Partner role play"}, {"src": "slides/day-06-slide-16.jpg", "thumb": "slides/day-06-slide-16-thumb.jpg", "title": "Four things, in order"}, {"src": "slides/day-06-slide-17.jpg", "thumb": "slides/day-06-slide-17-thumb.jpg", "title": "Working Smarter at Scale"}]}, {"day": 7, "title": "Working Smarter at Scale", "intro": "Turn a large book into intentional segments and focused action.", "practice": ["Build and work a segment from your real book.", "Diagnose the funnel before simply adding activity."], "amendments": ["Sequences do not override ownership or contact restrictions. Stop SDR prospecting after the demo is attended."], "sections": [{"number": 1, "title": "Working Smarter at Scale", "blocks": ["TODAY'S QUESTION", "How do you do all of that intentionally across your entire Book of Business?", "THE LOOP", "YOU ALREADY KNOW HOW TO", "Prioritize  ·  Segment\nChoose outreach\nExecute  ·  Reassess", "Research a prospect.", "Call a prospect.", "Navigate the conversation.", "Six days of skills. Today they become a system.", "Working more leads isn't the same as working your Book well."]}, {"number": 2, "title": "Activity isn't strategy", "blocks": ["EFFORT + DIRECTION", "Activity is the price of entry. It's what you point it at that decides the outcome.", "RANDOM EXECUTION", "INTENTIONAL EXECUTION", "Open the tool, dial whatever loads.", "You decide who gets worked, before you start.", "One list, worked until it's dry.", "Leads grouped by a shared reason.", "Same approach for every lead.", "The action fits the reason.", "More dials when it isn't working.", "The numbers tell you what to change.", "Busy. Not necessarily productive.", "Same effort. Very different day.", "Both reps hit their activity numbers. Only one of them is building a pipeline.", "The activity expectations don't go away. This is about where that effort gets pointed — not about doing less of it."]}, {"number": 3, "title": "The loop you run every day", "blocks": ["THE FRAMEWORK", "Day 3 gave you the first half. Today we finish it.", "BOOK OF BUSINESS", "PRIORITIZE", "SEGMENT", "CHOOSE OUTREACH", "EXECUTE", "REASSESS", "Everything you own", "Who deserves attention", "Group by shared reason", "Match action to reason", "Dial · sequence · task", "What did the numbers say", "↻   Reassess feeds straight back into tomorrow's priority.", "WHAT DAY 3 ALREADY TAUGHT", "WHAT DAY 7 ADDS", "Book of Business  →  Priority  →  Segment  →  Action", "Choose outreach  →  Execute  →  Reassess", "Statuses, codes, active vs static lists, and the four jobs a list can do. None of that changes today.", "How the segment gets worked, how you run it at volume, and how your own numbers tell you what to fix.", "Same Book. Same methodology. This is the rest of the lap."]}, {"number": 4, "title": "Who deserves my attention today?", "blocks": ["STEP 1  ·  PRIORITIZE", "This question gets answered before you touch a tool.", "ASK IT BEFORE YOU", "Build a list", "Open Orum", "Start a sequence", "Make a call", "THE SIGNALS YOU ALREADY HAVE", "STATUS", "YOUR CODE", "LAST ACTIVITY", "FIT", "New · Recycled · Attempting are your live pool. Nurture waits.", "AF1 and AF2 are already pre-vetted. AFH earns the top of the list.", "Attempting goes quiet for 30 days and you lose it to Nurture.", "Priority 1 verticals and clean software ahead of everything else.", "The tool should not decide what you work. You should.", "Nothing new here — Day 3 gave you all four. The discipline is using them before you start, not after."]}, {"number": 5, "title": "A list needs a reason to exist", "blocks": ["STEP 2  ·  SEGMENT", "Segmenting isn't filtering for its own sake. It's how a Book becomes something you can finish.", "A useful list = prospects you're working the same way, for the same reason.", "WHY WE SEGMENT", "THE TEST", "Instead of casting a wide net, cast a smaller, more strategic one.", "Can I say in one sentence why these leads are together?", "Does that reason change how I work them?", "A segment lets you prioritize connects and ICP fit — and it makes the next decision obvious, because everyone in the list needs the same thing.", "Can I finish it?", "Three noes means it's a filter, not a segment.", "EVERY LIST STARTS THE SAME WAY", "Contact Owner   ·   LeadStatus   ·   Current Software is not MarianaTek, ClubReady or Gym Master"]}, {"number": 6, "title": "Different leads need different plays", "blocks": ["STEP 2  ·  SEGMENT", "Who's in the group → why they're grouped → what action that implies.", "WHO IS IN THIS GROUP?", "WHY ARE THEY GROUPED?", "WHAT ACTION MAKES SENSE?", "New · AF1 · Priority 1 vertical", "Pre-vetted, strong fit, never dialed.", "Straight into a dialing list. No research left to do.", "Recycled", "Three-month cooling period is over.", "They need an opener that acknowledges the last conversation.", "Attempting · quiet 20+ days", "About to fall out of your working pool.", "Work them now or lose them to Nurture at 30 days.", "Current Software = one competitor", "Same platform, so the same problems.", "One angle works across the whole list.", "If the grouping doesn't change how you work them, it isn't a segment — it's a filter."]}, {"number": 7, "title": "Let the reason pick the action", "blocks": ["STEP 3  ·  CHOOSE OUTREACH", "The segment already told you what these leads need. Match the play to it.", "WHY ARE THEY GROUPED?", "WHAT DO THEY NEED?", "HOW SHOULD I WORK THEM?", "CALL", "SEQUENCE", "FOLLOW-UP TASK", "Pre-vetted and dialable. AF1 and AF2 exist for exactly this.", "A group that needs more than one touch to land.", "You already spoke to them and something was owed.", "Cold, unworked volume → parallel dial. Unmarked, warm or hot → power dial.", "Orum completes the call task on a connect, no answer or voicemail — not on a busy signal or a failed number.", "Named callbacks, follow-up dispositions, anything you promised on a call.", "Parallel dialing is for cold leads only. Anything unmarked, warm or hot gets power dialed.", "Email methodology is Day 9 — today we're only deciding which channel the segment belongs in."]}, {"number": 8, "title": "Orum executes the strategy. It doesn't create it.", "blocks": ["STEP 4  ·  EXECUTE", "The thinking happens before the dialing session, not during it.", "RIGHT LEADS", "RIGHT SEGMENT", "RIGHT CONTEXT", "DIAL AT SCALE", "Prioritized from your Book", "Grouped for one reason", "SDR Additional Notes filled in", "Now you open Orum", "GARBAGE IN, GARBAGE OUT", "WHAT YOU WANT IN FRONT OF YOU", "Your HubSpot data quality decides your Orum results.", "Name, job title, company", "Prospect and account notes", "A clean record with real notes is a better call. Add enough net-new prospects to your lists daily so you're never dialing the same dead numbers.", "Sequence or task the call belongs to", "That's what a prepared dial looks like.", "Don't open Orum and dial whatever appears. Decide the list first — then dial it hard."]}, {"number": 9, "title": "One attempt isn't a strategy", "blocks": ["STEP 4  ·  EXECUTE", "Most prospects take more than one opportunity to engage. Plan for that on purpose.", "ISOLATED ATTEMPTS", "A CONNECTED SEQUENCE OF TOUCHES", "Each call starts from nothing.", "Every attempt is dispositioned the same day.", "No record of what was already said.", "Notes carry from one touch to the next.", "The lead goes quiet and nobody notices.", "Follow-up dispositions become tomorrow's list.", "Same opener every time.", "Each touch knows what the last one did.", "DISPOSITIONING IS WHAT MAKES THIS WORK", "Your disposition drives the status automation, the sequence task, and whether the lead shows up on tomorrow's follow-up list. Log it wrong and the whole chain breaks.", "Consistency beats intensity. Day 9 teaches the channels — today it's just the habit."]}, {"number": 10, "title": "Your funnel tells you what's broken", "blocks": ["STEP 5  ·  REASSESS", "Four numbers. Each one answers a different question about your day.", "DIAL", "CONNECT", "CONVERSATION", "MEETING", "Every number you attempted.", "% of dials you logged as a Connect", "% of connects over one minute", "% of conversations you logged as a Meeting", "AVERAGE", "STRIVE FOR", "STRIVE FOR", "5%", "50%", "20%", "TWO MORE THAT MATTER IF YOU PARALLEL DIAL OR GET CALLBACKS", "Strive for 50%", "Strive for 50%", "BRIDGED TO CONNECT", "CALLBACK TO CONNECT", "Parallel dials where you heard the beep and logged a Connect.", "Callbacks you answered and logged as a Connect.", "Connect rate is our own average. The rest come from Orum's benchmark data — a floor to aim at, not a performance standard."]}, {"number": 11, "title": "Diagnose the conversion point first", "blocks": ["STEP 5  ·  REASSESS", "Three different problems. Three completely different responses.", "LOW DIAL → CONNECT", "LOW CONNECT → CONVERSATION", "LOW CONVERSATION → MEETING", "You're not reaching humans.", "You reach them and lose them.", "They talk, and it goes nowhere.", "ASK", "ASK", "ASK", "Are we reaching the right people?", "What happens in the first few seconds?", "Are we creating relevance?", "Is the contact data good?", "Are we earning attention?", "Are we discovering, or interrogating?", "When are we calling — and does the When to Call tab agree?", "Are we saying their name, company and title fast enough?", "Are we navigating resistance?", "Are we prioritizing mobile numbers?", "Are we asking for the 30 seconds?", "Are we actually asking for the meeting?", "These are questions to investigate — not conclusions. The number tells you where to look, never why."]}, {"number": 12, "title": "Adjust before you add", "blocks": ["STEP 5  ·  REASSESS", "“Do more dials” is sometimes the answer. It is not always the answer.", "IDENTIFY THE GAP", "CHANGE THE BEHAVIOR", "EXECUTE", "MEASURE AGAIN", "Plenty of dials, few connects", "Look at data, timing and number type before you add volume.", "Connects, but no conversations", "Go back to your opener and your first ten seconds.", "Conversations, but no meetings", "Review discovery, relevance, objection handling, and whether you're actually asking.", "Use your numbers to decide what to coach."]}, {"number": 13, "title": "Build tomorrow's plan", "blocks": ["APPLICATION  ·  YOUR REAL BOOK", "Open your own Book of Business. Answer five questions. Leave with a plan, not notes.", "WHAT am I prioritizing tomorrow?", "HOW am I segmenting those prospects?", "WHY does each segment exist?", "HOW will I work each segment?", "WHAT will I look at afterward?", "Status, code, last activity, fit.", "Standard filters first, then what makes it strategic.", "One sentence. If you can't, it's not a segment.", "Call, sequence, or follow-up task — and why that one.", "Which conversion point tells you if it worked.", "Real leads. Real segments. You should be able to sit down tomorrow morning and just run it.", "Then share it. Two minutes each — segment, reason, action.", "The room's job: does the reason justify the action?"]}, {"number": 14, "title": "Five words, in order", "blocks": ["DAY 7 TAKEAWAY", "PRIORITIZE.", "SEGMENT.", "EXECUTE.", "ANALYZE.", "ADJUST.", "Great SDRs don't just do the work.", "They understand what they're working, why they're working it, and what their results are telling them.", "Tomorrow morning you'll know who you're calling and why — before you open anything."]}, {"number": 15, "title": "From “Yes” to Meeting Held", "blocks": ["TOMORROW", "WHAT WE'LL COVER", "BOOK", "CONFIRM", "HANDOFF", "YOU CAN NOW", "Prioritize your Book.", "PROTECT", "Segment with a reason.", "FOLLOW THROUGH", "Execute at scale.", "Read your own funnel.", "Preview only — we teach it tomorrow.", "You've earned the meeting. Now make sure the right one actually happens."]}], "videos": [{"title": "Adding And Removing From Sequence", "src": "videos/adding-and-removing-from-sequence.mp4"}, {"title": "Creating & Managing Tasks", "src": "videos/creating-managing-tasks.mp4"}, {"title": "Advanced Lists", "src": "videos/advanced-lists.mp4"}], "source": "resources/onboarding-day-7.pptx", "slides": [{"src": "slides/day-07-slide-01.jpg", "thumb": "slides/day-07-slide-01-thumb.jpg", "title": "Working Smarter at Scale"}, {"src": "slides/day-07-slide-02.jpg", "thumb": "slides/day-07-slide-02-thumb.jpg", "title": "Activity isn't strategy"}, {"src": "slides/day-07-slide-03.jpg", "thumb": "slides/day-07-slide-03-thumb.jpg", "title": "The loop you run every day"}, {"src": "slides/day-07-slide-04.jpg", "thumb": "slides/day-07-slide-04-thumb.jpg", "title": "Who deserves my attention today?"}, {"src": "slides/day-07-slide-05.jpg", "thumb": "slides/day-07-slide-05-thumb.jpg", "title": "A list needs a reason to exist"}, {"src": "slides/day-07-slide-06.jpg", "thumb": "slides/day-07-slide-06-thumb.jpg", "title": "Different leads need different plays"}, {"src": "slides/day-07-slide-07.jpg", "thumb": "slides/day-07-slide-07-thumb.jpg", "title": "Let the reason pick the action"}, {"src": "slides/day-07-slide-08.jpg", "thumb": "slides/day-07-slide-08-thumb.jpg", "title": "Orum executes the strategy. It doesn't create it."}, {"src": "slides/day-07-slide-09.jpg", "thumb": "slides/day-07-slide-09-thumb.jpg", "title": "One attempt isn't a strategy"}, {"src": "slides/day-07-slide-10.jpg", "thumb": "slides/day-07-slide-10-thumb.jpg", "title": "Your funnel tells you what's broken"}, {"src": "slides/day-07-slide-11.jpg", "thumb": "slides/day-07-slide-11-thumb.jpg", "title": "Diagnose the conversion point first"}, {"src": "slides/day-07-slide-12.jpg", "thumb": "slides/day-07-slide-12-thumb.jpg", "title": "Adjust before you add"}, {"src": "slides/day-07-slide-13.jpg", "thumb": "slides/day-07-slide-13-thumb.jpg", "title": "Build tomorrow's plan"}, {"src": "slides/day-07-slide-14.jpg", "thumb": "slides/day-07-slide-14-thumb.jpg", "title": "Five words, in order"}, {"src": "slides/day-07-slide-15.jpg", "thumb": "slides/day-07-slide-15-thumb.jpg", "title": "From “Yes” to Meeting Held"}]}, {"day": 8, "title": "From Yes to Meeting Held", "intro": "Book, confirm, prepare, and recover meetings until they are held.", "practice": ["Practice booking and a complete AE handoff.", "Explain the next action for an unaccepted invite, cancellation, and no-show."], "amendments": ["Attendance is mandatory for booked demos, except overlapping demos or outside working hours. Prioritize the strongest opportunity for overlaps; notify your manager about internal-meeting conflicts and catch up afterward.", "If present, do not wait for an AE attendance update: allow a few minutes, call to recover the live meeting, then follow the no-show sequence daily for at least two weeks if needed.", "For reschedules, keep a meaningfully connected AE if the prospect is flexible; otherwise prioritize availability through round-robin."], "sections": [{"number": 1, "title": "From “Yes” to Meeting Held", "blocks": ["TODAY", "BOOK", "CONFIRM", "HANDOFF", "DAY 5", "TODAY", "You learned how to\nearn the meeting.", "You protect it until\nit actually happens.", "PROTECT", "The prospect said yes. That's the start of your job, not the end of it.", "Booking the meeting is not the finish line."]}, {"number": 2, "title": "A booking isn't pipeline", "blocks": ["WHY TODAY EXISTS", "A calendar invite is a record of an intention. It isn't the thing you're paid for.", "THE RIGHT MEETING", "IT ACTUALLY HAPPENS", "THERE'S A REASON TO CONTINUE", "+", "+", "It clears our demo parameters. A meeting that shouldn't have been booked costs the AE an hour and you a credit.", "They accept, they remember, they show up. Everything today is about this one.", "The AE walks in knowing why this prospect said yes — so the conversation can go somewhere.", "OPTIMIZING FOR INVITES LOOKS LIKE", "OPTIMIZING FOR HELD MEETINGS LOOKS LIKE", "Anything on the calendar counts.", "Booked close, confirmed, accepted.", "“Sure, send me something.” treated as a yes.", "The prospect knows exactly what's coming.", "The AE finds out who they're meeting when the call starts.", "The AE opens the meeting already informed.", "Don't optimize for calendar invites. Optimize for quality meetings that hold."]}, {"number": 3, "title": "Finish the call strong", "blocks": ["THE MOMENT AFTER YES", "You've got the yes. The next ninety seconds decide whether it becomes a meeting.", "CONFIRM INTEREST", "FIND THE RIGHT TIME", "SET EXPECTATIONS", "CONFIRM NEXT STEPS", "Say back why they agreed, in their words.", "Their time zone, their calendar, as soon as it works.", "What's coming, from whom, and when.", "Invite sent, invite accepted, follow-up promised.", "OUR CALL WRAP-UP CHECKLIST", "Ask for invite acceptance", "Recap date and time", "Set expectations for follow-up", "Mention the topic you'll cover", "Purpose: reinforce commitment and increase show rate.", "None of this is small talk. Every line on that checklist exists to make the meeting harder to forget and easier to keep."]}, {"number": 4, "title": "Book it close", "blocks": ["TIMING", "Book it close", "Aim for 0–3 days out. Show rate inside that window is significantly higher.", "Our own booking guidance, and the single easiest lever you have on show rate.", "WHAT DECAYS WHILE YOU WAIT", "INTEREST", "CONTEXT", "URGENCY", "MEMORY", "The reason they said yes felt urgent on the call. It won't in ten days.", "Whatever was going on in their business when you called has moved on.", "A problem worth a meeting next week is a problem worth ignoring next month.", "They will not remember your name, your company, or why they agreed.", "When you can, keep the momentum. The meeting they take is the one that still feels connected to the call.", "Our material says show rate inside 0–3 days is significantly higher. It doesn't publish a number, so we're not quoting one."]}, {"number": 5, "title": "Make it real while you still have them", "blocks": ["BEFORE YOU HANG UP", "Everything ambiguous at the end of this call becomes a no-show later.", "DATE + TIME", "WHO'S ATTENDING", "WHAT TO EXPECT", "INVITE SENT", "INVITE ACCEPTED", "ASKING FOR THE ACCEPTANCE — HOW IT SOUNDS", "“You should've received an invite — can you click ‘Yes' so it appears on your calendar?”", "“Great, we'll reserve this time. I just sent that over — did you get it?”", "“If it's not accepted by ___, I'll give you a call back to make sure you have it.”", "NOT A CONFIRMED MEETING", "A CONFIRMED MEETING", "“Sure, send me something.”", "A time they named, and an invite they accepted.", "Always ask for the acceptance. Show rate with an accepted invite is significantly higher."]}, {"number": 6, "title": "The AE should not walk in blind", "blocks": ["THE HANDOFF", "You had the conversation. The AE didn't. Everything you know dies with you unless you write it down.", "You are the only person who heard why this prospect said yes.", "WHAT A REAL HANDOFF BUYS YOU", "BETTER EXPERIENCE", "LESS REPETITION", "MORE RELEVANT", "BETTER PREPARED", "The prospect isn't re-explaining their business to a stranger.", "The AE doesn't spend fifteen minutes on discovery you already did.", "The demo goes where the pain is, not down a generic feature tour.", "The AE can research before the call because they know what to look for.", "WHERE IT LIVES", "SDR Meeting Set Notes, pinned to the top of the company page   ·   plus an intro email to the prospect with the AE copied", "There is no such thing as too much information in these notes."]}, {"number": 7, "title": "What makes it strong", "blocks": ["THE HANDOFF", "Four questions. If your notes answer them, the AE is ready.", "WHO THEY ARE", "WHY THEY AGREED", "WHAT MATTERS", "RELEVANT CONTEXT", "Business type, size, locations, current software, job title.", "The thing they said on the call that made a meeting worth it.", "The problem in their words — not a feature they asked about.", "Timing, competitors, who else is involved, anything you promised.", "WEAK", "STRONG", "“Interested in Momence.”", "Pilates studio, two locations, 14 weekly classes. Owner runs booking and billing herself on a legacy platform. Said client questions eat her evenings. Agreed to see how bookings and messaging work in one place.", "The AE now knows exactly what they knew before: someone agreed to a meeting. Everything you learned on the call is gone.", "Write it for someone who wasn't there. If the AE has to ask you a question before the meeting, the note wasn't finished."]}, {"number": 8, "title": "Your job doesn't end at the calendar event", "blocks": ["MEETING PROTECTION", "Four checkpoints between “yes” and “held.” You own all of them.", "BOOKED", "INVITE ACCEPTED", "FOLLOW-UP", "MEETING HELD", "Right AE, right time, fields complete.", "Asked for on the call. Chased if it doesn't land.", "Intro email, reminder task, day-before and morning-of.", "The only one of these that counts.", "THE MINDSET", "THE OWNERSHIP", "Hold your prospect's hand.", "The responsibility is yours, not the AE's.", "Tell them what to expect and when to expect it, at every step. Set that way, follow-up never feels like bothering them — it's what you said you'd do.", "They are our first priority. We are not theirs. That asymmetry is the job — and it's why protection is a process, not a hope.", "Preventing a no-show begins while you are still on the booking call."]}, {"number": 9, "title": "The calendar invite tells you something", "blocks": ["READ THE SIGNAL", "The point isn't the click. It's what the click — or the silence — is telling you.", "ACCEPTED", "NOT ACCEPTED", "They engaged with it. The meeting exists on their calendar, with a reminder attached.", "Could be spam, could be the wrong email, could be second thoughts. You don't know which.", "WHAT YOU STILL DO", "WHAT IT EARNS", "Intro email, reminder task, day-of touch. Accepted is a good signal, not a guarantee.", "A reason to call — and a legitimate one, because you told them on the call you would.", "CHASING AN UNACCEPTED INVITE — HOW IT SOUNDS", "“Did you get the invite I sent over? Sometimes it ends up in spam.”", "“We have a call scheduled tomorrow — do you see that on your calendar?”", "“Can you accept that so I can loop in the right person from my team?”", "Notice what these have in common: every one gives them an easy, non-awkward way to answer."]}, {"number": 10, "title": "Follow-up should reduce friction", "blocks": ["PROTECTION IN PRACTICE", "It's not persistence for its own sake. Each touch removes a reason the meeting could fall over.", "DAY BEFORE", "MORNING OF", "If the invite still isn't accepted", "Before the demo", "Call. No answer? Try again — two or three attempts.", "Call ahead — two or three attempts, depending on the time.", "On the last one, leave a message or tell the gatekeeper.", "Text the Zoom link.", "Text or email asking them to confirm they'll be there.", "Mention they should join from a laptop or tablet.", "Say you'll call in the morning if you don't hear back.", "Keep the tone assumptive: the meeting is happening.", "ASSUMPTIVE, NOT AGGRESSIVE", "AND ALWAYS LEAVE THE DOOR OPEN", "Talk as though the meeting is happening. Don't volunteer a reschedule they haven't asked for.", "Every touch should make it easy for them to tell you if something has changed.", "You set the expectations on the call. Following through on them isn't bothering anyone."]}, {"number": 11, "title": "Match the response to what actually happened", "blocks": ["WHEN PLANS CHANGE", "A changed meeting isn't automatically a lost one. But the next action has to fit.", "UNACCEPTED INVITE", "FOLLOW UP", "Call, then text or email. You already told them you would.", "CANCELLATION", "DIAGNOSE, THEN RESCHEDULE", "Work out which kind of cancel this is before you do anything else.", "NO-SHOW", "RE-ENGAGE IMMEDIATELY", "When you are present, act directly rather than waiting for the AE. Call and text right away — email if you have no direct line — then add them to the No Show Sequence.", "TWO KINDS OF CANCEL — AND THEY ARE NOT THE SAME", "“LEAVE ME ALONE”", "TIMING", "Go back to the booking call. Was this a yes just to say yes? Call rather than email — it's harder to brush off and you'll get the real reason.", "Short-term: reschedule fast — the longer it drifts the less likely you get them back. Long-term: check it isn't a smoke screen, then set a task and follow up.", "Assume something happened — not that they're ignoring you. A clear no is still better than silence."]}, {"number": 12, "title": "Low show rate: where should I look?", "blocks": ["SELF-DIAGNOSIS", "Same habit as Day 7. The number tells you to investigate — it doesn't tell you why.", "SHOW RATE IS AN OUTCOME. THESE ARE THE BEHAVIORS UNDERNEATH IT.", "TIME TO MEETING", "INVITE ACCEPTANCE", "EXPECTATIONS SET", "FOLLOW-UP", "REASON FOR THE MEETING", "How far out am I booking? How many of these sat more than three days?", "Am I actually asking on the call — or assuming they'll click it?", "Did they know what was coming, from whom, and when?", "Did the day-before and morning-of touches happen, or only when convenient?", "Was there a real reason they agreed — or did I take a soft yes?", "Not every no-show is preventable. Most of what decides your show rate is still yours to control."]}, {"number": 13, "title": "Four things, in order", "blocks": ["DAY 8 TAKEAWAY", "BOOK IT.", "CONFIRM IT.", "HAND OFF WELL.", "PROTECT IT.", "The goal isn't a meeting on the calendar.", "The goal is the right meeting actually happening.", "Everything that happens after “yes” is still your job."]}, {"number": 14, "title": "Multichannel Prospecting", "blocks": ["TOMORROW", "WHAT WE'LL COVER", "CONTEXT", "INTENT", "SO FAR", "CHANNEL", "Calling has been the center of the motion.", "TOMORROW", "MESSAGE", "How do calls, email and SMS work together?", "Preview only — we teach it tomorrow.", "Same prospect. Different channels. One conversation."]}], "videos": [{"title": "Booking A Meeting", "src": "videos/booking-a-meeting.mp4"}, {"title": "Booking A Meeting Pt 2", "src": "videos/booking-a-meeting-pt-2.mp4"}], "source": "resources/onboarding-day-8.pptx", "slides": [{"src": "slides/day-08-slide-01.jpg", "thumb": "slides/day-08-slide-01-thumb.jpg", "title": "From “Yes” to Meeting Held"}, {"src": "slides/day-08-slide-02.jpg", "thumb": "slides/day-08-slide-02-thumb.jpg", "title": "A booking isn't pipeline"}, {"src": "slides/day-08-slide-03.jpg", "thumb": "slides/day-08-slide-03-thumb.jpg", "title": "Finish the call strong"}, {"src": "slides/day-08-slide-04.jpg", "thumb": "slides/day-08-slide-04-thumb.jpg", "title": "Book it close"}, {"src": "slides/day-08-slide-05.jpg", "thumb": "slides/day-08-slide-05-thumb.jpg", "title": "Make it real while you still have them"}, {"src": "slides/day-08-slide-06.jpg", "thumb": "slides/day-08-slide-06-thumb.jpg", "title": "The AE should not walk in blind"}, {"src": "slides/day-08-slide-07.jpg", "thumb": "slides/day-08-slide-07-thumb.jpg", "title": "What makes it strong"}, {"src": "slides/day-08-slide-08.jpg", "thumb": "slides/day-08-slide-08-thumb.jpg", "title": "Your job doesn't end at the calendar event"}, {"src": "slides/day-08-slide-09.jpg", "thumb": "slides/day-08-slide-09-thumb.jpg", "title": "The calendar invite tells you something"}, {"src": "slides/day-08-slide-10.jpg", "thumb": "slides/day-08-slide-10-thumb.jpg", "title": "Follow-up should reduce friction"}, {"src": "slides/day-08-slide-11.jpg", "thumb": "slides/day-08-slide-11-thumb.jpg", "title": "Match the response to what actually happened"}, {"src": "slides/day-08-slide-12.jpg", "thumb": "slides/day-08-slide-12-thumb.jpg", "title": "Low show rate: where should I look?"}, {"src": "slides/day-08-slide-13.jpg", "thumb": "slides/day-08-slide-13-thumb.jpg", "title": "Four things, in order"}, {"src": "slides/day-08-slide-14.jpg", "thumb": "slides/day-08-slide-14-thumb.jpg", "title": "Multichannel Prospecting"}]}, {"day": 9, "title": "Multichannel Prospecting", "intro": "Connect calls, email, and SMS into a coherent prospect experience.", "practice": ["Write an email from real prospect context.", "Choose three prospects and explain intent, channel, and message."], "amendments": ["All outreach must be logged. SDR calls, emails, and texts through HubSpot reset the 30-day activity clock; marketing does not. Social activity counts for the seven-day inbound-credit rule."], "sections": [{"number": 1, "title": "Multichannel Prospecting", "blocks": ["TODAY'S QUESTION", "What am I trying to accomplish with this prospect — and which channel and message make sense next?", "CALL", "EMAIL", "SMS", "THE FRAMEWORK", "Have the conversation", "Support it", "Where it fits", "Context  →  Intent\nChannel  →  Message", "Calling stays at the center. Today the rest of it gets organized around it.", "Great prospecting isn't one channel."]}, {"number": 2, "title": "More channels, not more noise", "blocks": ["WHY BOTHER", "Most prospects need more than one chance to engage. Create those without becoming a nuisance.", "“CONTACT THEM EVERYWHERE”", "RELEVANT OPPORTUNITIES TO ENGAGE", "The same message, sent three ways.", "People engage in different places — meet them there.", "A touch because it's a touch.", "Each touch has its own job.", "Email used as a way to stop calling.", "What happened last time shapes what happens next.", "Nothing connects to anything else.", "The whole thing reads as one conversation.", "This is what makes prospects block you.", "This is what gets you a reply.", "Multichannel doesn't mean contact them everywhere. It means creating relevant opportunities to engage.", "You've already done this. Protecting a meeting on Day 8 used a call, an email and a text — each doing something different."]}, {"number": 3, "title": "The call is still the center", "blocks": ["GET THIS STRAIGHT FIRST", "Email and SMS support prospecting. They are not a way to avoid having the conversation.", "Create and have the conversation.", "CALL", "Everything you learned on Days 5 and 6 lives here. A conversation is where you discover, create relevance, handle resistance and ask for the meeting.", "Support, reinforce, continue.", "EMAIL  +  SMS", "They open a door to a conversation, keep one alive between attempts, or deliver something the prospect asked you for. None of that replaces the call.", "If your dial count drops the week you get good at email, you've misunderstood today.", "Nothing about your activity expectations changes today."]}, {"number": 4, "title": "Context → Intent → Channel → Message", "blocks": ["THE FRAMEWORK", "In that order. Reps who start at “message” end up writing the same email to everyone.", "CONTEXT", "INTENT", "CHANNEL", "MESSAGE", "What do I know?", "What am I trying to do?", "Where does this belong?", "What do I actually say?", "Everything from pre-vetting, plus every interaction so far — what was said, what happened, what they told you.", "Open a conversation? Restart a stalled one? Deliver something they asked for? Confirm a meeting? Be specific.", "The intent decides this. A conversation belongs on the phone. A link belongs in a text.", "This is last, and it's the easy part — because by now you know who, why and where.", "WHAT GOES WRONG WITHOUT IT", "A rep opens a blank email, doesn't know what they want, and writes something generic to fill the gap. The channel was never the problem.", "You should be able to say your intent in one sentence before you choose a channel."]}, {"number": 5, "title": "Each channel has a job", "blocks": ["NOT INTERCHANGEABLE", "Choose one because it does something the others can't — not because it's easier.", "CALL", "EMAIL", "SMS", "Have the conversation.", "Earn attention in writing.", "Short, direct, time-sensitive.", "USE IT FOR", "USE IT FOR", "USE IT FOR", "Discovery", "Open a door when calls don't land", "Send a link they asked for", "Objections", "Give a reason to take the next call", "Confirm a meeting the day before", "The meeting ask", "Recap what was agreed", "Send the Zoom link the morning of", "Anything needing a live response", "The AE intro before a demo", "Reach someone after a no-show", "WHERE OUR SMS GUIDANCE COMES FROM", "Two places only: our email material says to offer a text when someone wants a link, and Day 8 uses texts to protect a booked meeting. There is no broader Momence SMS playbook yet.", "If it needs a real conversation, it's a call. Don't email your way around it."]}, {"number": 6, "title": "Write it the way they read it", "blocks": ["THE EMAIL ITSELF", "They see it in this order. Write it in this order.", "SUBJECT LINE", "Three words or fewer. Never sales-y — no “Increase your bookings.” After a call, go warm: “Just called,” “Just spoke.”", "PREVIEW PANE", "The first line they see, before they open it. Put the hook here. Don't spend it introducing yourself or on “hope all is well.”", "BODY", "It should read like a text. Two or three sentences per paragraph, never more. They shouldn't have to scroll.", "LINKS", "Leave them out — links make spam more likely. If they want something with a link in it, ask whether you can text it instead.", "Short isn't the goal. Short is what happens when you know exactly what you're asking for."]}, {"number": 7, "title": "Personalization isn't relevance", "blocks": ["THE DISTINCTION THAT MATTERS", "One proves you looked them up. The other gives them a reason to reply.", "PERSONALIZATION", "RELEVANCE", "Shows you researched them.", "Shows why the conversation matters to them.", "PERSONALIZED, NOT RELEVANT", "RELEVANT", "“Saw you just added a second Saturday class — congrats on the growth!”", "“Saw you added a second Saturday class — is the confirming and rescheduling around that still landing on you?”", "SAME RESEARCH. THE SECOND ONE DID SOMETHING WITH IT.", "The first is a compliment. The second connects what you found to a problem they'd recognize — and asks about it.", "Don't personalize to prove you Googled them. Make the research matter."]}, {"number": 8, "title": "Write from the problem, not the product", "blocks": ["SAME THINKING AS DAY 2", "The prospect doesn't care what Momence does. They care what's costing them time.", "WHAT WE KNOW", "LIKELY PROBLEM", "WHY IT MATTERS", "RELEVANT VALUE", "CTA", "From pre-vetting and the last interaction.", "What that usually means for a business like theirs.", "Time, revenue, or something slipping through the cracks.", "One thing we do about it. Not the list.", "One easy question they can answer.", "PRODUCT-FIRST", "PROSPECT-FIRST", "Momence is an all-in-one platform with bookings, automated sequences and two-way texting. Would you be open to a demo?", "Most studios your size are still confirming and rescheduling by hand, which usually eats the owner's first hour. Is that landing on you or on staff?", "True, and about us. Nothing here belongs to them.", "Their problem, their words, one question.", "One problem. One reason it matters. One question. That's the whole email."]}, {"number": 9, "title": "Every interaction creates context for the next one", "blocks": ["CONNECTED, NOT PARALLEL", "A call and an email shouldn't read like two different people prospecting the same account.", "WHAT HAPPENED?", "WHAT DID I LEARN?", "WHAT SHOULD THE NEXT TOUCH DO?", "WHAT DO I SAY?", "WORKED THROUGH", "What happened", "Reached the owner. She was mid-class changeover and said now wasn't good.", "What I learned", "She answers her own phone, and she's the one running the day.", "What the next touch should do", "Earn thirty seconds at a time that isn't the middle of her day.", "What I say", "Warm subject — “Just called.” One line about the admin that lands on the owner. One question.", "The email exists because of what happened on the call. That's the whole idea."]}, {"number": 10, "title": "The outcome decides the follow-up", "blocks": ["READ WHAT HAPPENED", "Same prospect, four different last touches — four different next moves.", "CONNECTED, NO BOOKING", "Keep a live conversation alive", "You have real material. Reference what they told you and go back for the meeting.", "VOICEMAIL", "Give the voicemail somewhere to land", "Warm subject line — “Just called.” Short, and a reason to pick up next time.", "“SEND ME INFORMATION”", "Turn a brush-off into a conversation", "Day 6 already told you what this is. Send something short and specific, and ask a question with it.", "NO RESPONSE AT ALL", "Change the angle, not the volume", "Repeating yourself louder doesn't work. Try a different problem, or a different channel.", "There's no required script and no required timing here. What's required is that the next touch knows what the last one did."]}, {"number": 11, "title": "Your outreach should feel connected", "blocks": ["PUT IT TOGETHER", "Not a schedule. A thread — where each touch is decided by the one before it.", "CALL", "EMAIL", "CALL", "EMAIL", "CALL", "No answer.", "“Just called.” One problem, one question.", "Reached her. Mid-class. Not now.", "Uses what she said. Asks for a better time.", "Booked.", "Every arrow above is a decision, not a calendar entry.", "A CADENCE", "A JOURNEY", "Day 1 call. Day 2 email. Day 3 text.", "Each touch answers the last one.", "Runs the same whether they answered or not.", "The prospect experiences one person, paying attention.", "Sequences carry the work. Context decides what goes in them."]}, {"number": 12, "title": "One prospect. One email. Ten minutes.", "blocks": ["WORKSHOP  ·  WRITE ONE", "You'll get the context. Everything else is yours.", "Write it alone first. No templates, no phone, no help.", "THEN WE TALK ABOUT IT", "What did you choose to focus on?", "What makes it relevant to them?", "What did you leave out?", "What's your CTA?", "Why does this email make sense for this prospect?", "SUCCESS ISN'T", "SUCCESS IS", "Everyone writing the same email.", "Being able to explain why yours makes sense.", "Two reps can write completely different emails to the same prospect and both be right."]}, {"number": 13, "title": "Now do it with your own prospects", "blocks": ["APPLICATION  ·  YOUR REAL BOOK", "Pick three from your Book. Run the framework on each one.", "WHAT CONTEXT DO I HAVE?", "WHAT AM I TRYING TO DO NEXT?", "WHICH CHANNEL?", "WHAT SHOULD THE MESSAGE FOCUS ON?", "Pre-vetting notes, statuses, codes, every logged interaction.", "Say it in one sentence. If you can't, you don't have an intent yet.", "Chosen because of the intent — not because it's the easy one.", "One problem, why it matters, one question.", "Real prospects. Real context. You should leave with three touches you can actually send tomorrow.", "Pick a hard one. A stalled account teaches you more than a fresh AF1.", "Then log it. A touch nobody can find is a touch that didn't happen."]}, {"number": 14, "title": "Three things, in order", "blocks": ["DAY 9 TAKEAWAY", "RIGHT CONTEXT.", "RIGHT CHANNEL.", "RIGHT MESSAGE.", "Multichannel prospecting isn't about doing more touches.", "It's about making each touch make sense.", "If you can't say why you're sending it, don't send it."]}, {"number": 15, "title": "Put It All Together", "blocks": ["TOMORROW", "THE WHOLE WORKFLOW", "UNDERSTAND THE BoB", "PRIORITIZE", "PRE-VET", "SEGMENT", "OUTREACH", "NAVIGATE THE CONVERSATION", "For nine days you've learned the parts.", "HANDLE RESISTANCE", "BOOK", "Tomorrow you run the whole system.", "HANDOFF", "FOLLOW THROUGH", "One rep. One Book. One day, end to end.", "ANALYZE", "Preview only — no new material tomorrow. Just all of it at once."]}], "videos": [{"title": "Creating An Email Template", "src": "videos/creating-an-email-template.mp4"}, {"title": "Sending A Text", "src": "videos/sending-a-text.mp4"}, {"title": "Sending An Email", "src": "videos/sending-an-email.mp4"}], "source": "resources/onboarding-day-9.pptx", "slides": [{"src": "slides/day-09-slide-01.jpg", "thumb": "slides/day-09-slide-01-thumb.jpg", "title": "Multichannel Prospecting"}, {"src": "slides/day-09-slide-02.jpg", "thumb": "slides/day-09-slide-02-thumb.jpg", "title": "More channels, not more noise"}, {"src": "slides/day-09-slide-03.jpg", "thumb": "slides/day-09-slide-03-thumb.jpg", "title": "The call is still the center"}, {"src": "slides/day-09-slide-04.jpg", "thumb": "slides/day-09-slide-04-thumb.jpg", "title": "Context → Intent → Channel → Message"}, {"src": "slides/day-09-slide-05.jpg", "thumb": "slides/day-09-slide-05-thumb.jpg", "title": "Each channel has a job"}, {"src": "slides/day-09-slide-06.jpg", "thumb": "slides/day-09-slide-06-thumb.jpg", "title": "Write it the way they read it"}, {"src": "slides/day-09-slide-07.jpg", "thumb": "slides/day-09-slide-07-thumb.jpg", "title": "Personalization isn't relevance"}, {"src": "slides/day-09-slide-08.jpg", "thumb": "slides/day-09-slide-08-thumb.jpg", "title": "Write from the problem, not the product"}, {"src": "slides/day-09-slide-09.jpg", "thumb": "slides/day-09-slide-09-thumb.jpg", "title": "Every interaction creates context for the next one"}, {"src": "slides/day-09-slide-10.jpg", "thumb": "slides/day-09-slide-10-thumb.jpg", "title": "The outcome decides the follow-up"}, {"src": "slides/day-09-slide-11.jpg", "thumb": "slides/day-09-slide-11-thumb.jpg", "title": "Your outreach should feel connected"}, {"src": "slides/day-09-slide-12.jpg", "thumb": "slides/day-09-slide-12-thumb.jpg", "title": "One prospect. One email. Ten minutes."}, {"src": "slides/day-09-slide-13.jpg", "thumb": "slides/day-09-slide-13-thumb.jpg", "title": "Now do it with your own prospects"}, {"src": "slides/day-09-slide-14.jpg", "thumb": "slides/day-09-slide-14-thumb.jpg", "title": "Three things, in order"}, {"src": "slides/day-09-slide-15.jpg", "thumb": "slides/day-09-slide-15-thumb.jpg", "title": "Put It All Together"}]}, {"day": 10, "title": "Put It All Together", "intro": "Apply the full workflow and demonstrate your readiness.", "practice": ["Demonstrate your book-of-business workflow.", "Present a prospect strategy and complete a cold-call role-play.", "Your manager supplies certification criteria and decides readiness; no passing score is invented here."], "amendments": ["Current rules of engagement take precedence over older training examples. Certification scorecards, passing thresholds, and retake procedures are manager-defined and are not specified in the provided decks."], "sections": [{"number": 1, "title": "Put It All Together", "blocks": ["TODAY", "APPLICATION", "Your real Book", "CERTIFICATION", "Three exercises", "COACHING", "You've learned the pieces.", "Live feedback", "Today you run the system.", "Mostly you talking. Not us."]}, {"number": 2, "title": "The SDR system", "blocks": ["NINE DAYS, ONE SYSTEM", "Everything you've learned, in the order you actually run it.", "UNDERSTAND YOUR BoB", "PRIORITIZE", "PRE-VET", "SEGMENT", "OUTREACH", "NAVIGATE THE CONVERSATION", "DAY 3", "DAY 3 · 7", "DAY 2 · 4", "DAY 7", "DAY 7 · 9", "DAY 5", "HANDLE RESISTANCE", "BOOK", "HANDOFF", "FOLLOW THROUGH", "ANALYZE", "ADJUST", "DAY 6", "DAY 8", "DAY 8", "DAY 8", "DAY 7", "DAY 7", "None of this is new. Every box is something you were taught, and the badge tells you where."]}, {"number": 3, "title": "The workflow is a series of decisions", "blocks": ["IT'S NOT A CHECKLIST", "Anyone can follow steps. What we're certifying is the thinking underneath them.", "WHO deserves my attention?", "WHY am I working them?", "WHAT do I know?", "Status, code, last activity, fit.", "The segment needs a reason, or it's just a filter.", "Pre-vetting, plus everything logged since.", "WHAT am I trying to accomplish?", "WHAT should I do next?", "WHAT are my results telling me?", "One sentence. Then pick the channel.", "The last outcome decides the next move.", "Read the funnel before you add activity.", "Great SDR execution is making good decisions, repeatedly.", "Today, every answer you give gets one follow-up question: why?"]}, {"number": 4, "title": "From lead to meeting held", "blocks": ["ONE PROSPECT, START TO FINISH", "Where each skill shows up in a single account's journey.", "In your Book", "It's yours to run. Nine statuses, and four you actively work.", "DAY 3", "Prioritized", "New, Recycled and Attempting are live. Nurture waits.", "DAY 3 · 7", "Pre-vetted", "Fit, size, software, decision maker — coded AF1 or AF2, notes written.", "DAY 2 · 4", "Segmented and worked", "Grouped for one reason, and the reason picks the channel.", "DAY 7 · 9", "A conversation", "Ten seconds to earn attention, then discovery and relevance.", "DAY 5", "Resistance", "Acknowledge, disarm, add value, ask.", "DAY 6", "The meeting", "Direct ask, 0–3 days out, invite accepted before you hang up.", "DAY 5 · 8", "Handoff and protection", "Notes the AE can use, then followed through until it holds.", "DAY 8", "One account. Nine days of skills. This is what a working prospect actually looks like."]}, {"number": 5, "title": "Your Book of Business", "blocks": ["CERTIFICATION  ·  01", "Open your real Book. Walk us through it.", "SHOW US YOU CAN", "WHAT WE'RE LISTENING FOR", "Say what's actually in your Book.", "Why that lead and not the one next to it?", "Read the statuses and what each is telling you to do.", "Why does this segment exist?", "Use your codes — AF1, AF2, AFH, AFU.", "Identify what deserves attention today.", "What does that status change about your next action?", "Prioritize it, in order.", "Build a segment that has a real reason to exist.", "We are not checking whether you know where every button lives. That's what the reference library is for.", "Explain how you'd work it.", "Real leads. Real decisions. Expect “why?” after every one.", "Draws on Day 3 and Day 7."]}, {"number": 6, "title": "Prospect strategy", "blocks": ["CERTIFICATION  ·  02", "Pick five real prospects from your Book. Make the case for each one.", "BUSINESS FIT", "PERSONA FIT", "RELEVANT CONTEXT", "WORTH PURSUING?", "Vertical, size, current software.", "Who you'd be talking to, and why them.", "What pre-vetting and past activity gave you.", "Yes or no — and defend it either way.", "PRIORITY", "OUTREACH STRATEGY", "THE PROBLEM YOU'D LEAD WITH", "CHANNEL", "Where this sits against the rest of your Book.", "How you'd work them, and why that way.", "One problem, and why it matters to them.", "Call, email or text — because of the intent.", "There's no right answer here. There's a defensible one.", "Write up all five and send them to your manager by end of day. Draws on Day 2, Day 3, Day 4, Day 7 and Day 9."]}, {"number": 7, "title": "The cold call", "blocks": ["CERTIFICATION  ·  03", "Full role play, start to finish. The facilitator plays the prospect.", "OPEN", "EARN ATTENTION", "CREATE RELEVANCE", "DISCOVER", "FOLLOW THE THREAD", "CONNECT VALUE", "NAVIGATE RESISTANCE", "ASK FOR THE MEETING", "WHEN THE OBJECTION COMES", "ACKNOWLEDGE", "DISARM", "ADD VALUE", "ASK", "The framework is the standard. The exact wording is not.", "NOT BEING EVALUATED", "BEING EVALUATED", "Whether you used the example lines word for word.", "Whether you knew what you were trying to do next."]}, {"number": 8, "title": "How you're evaluated", "blocks": ["THE BAR", "Five things, across all three exercises.", "JUDGMENT", "METHODOLOGY", "RELEVANCE", "CONVERSATIONAL EXECUTION", "NEXT-ACTION DECISION MAKING", "Did you make a sound decision with the information you had?", "Did you use the frameworks — or work around them?", "Was it about their business, or about our product?", "Did you sound like a person having a conversation?", "Did you know what you were trying to do next?", "We are not looking for perfect scripts. We're looking for sound decisions and coachable execution.", "Coachable counts. A rep who takes feedback and changes something on the next attempt is exactly what we're looking for."]}, {"number": 9, "title": "Coach yourself", "blocks": ["AFTER TODAY", "Onboarding ends. The learning doesn't. You already have the method.", "LOOK AT RESULTS", "FIND THE GAP", "REVIEW THE BEHAVIOR", "ADJUST", "TRY AGAIN", "THE FUNNEL TELLS YOU WHERE TO LOOK", "DIAL", "CONNECT", "CONVERSATION", "MEETING", "Each conversion point answers a different question. Diagnose the point before you decide what to change.", "“Do more dials” is sometimes the answer. It is not always the answer.", "Straight from Day 7. Nothing new — just now it's yours to run without us."]}, {"number": 10, "title": "Your first week live", "blocks": ["TOMORROW", "Nothing here is new. It's just now the job.", "KEEP MANAGING YOUR BoB", "KEEP PRE-VETTING", "KEEP BUILDING CALLABLE PROSPECTS", "Open your Book, run the order, disposition everything the same day.", "Pre-vet now, and never stop. A Book that stops being pre-vetted goes dead.", "AF1 and AF2 don't replenish themselves.", "KEEP EXECUTING", "KEEP REVIEWING YOUR RESULTS", "KEEP ASKING FOR COACHING", "The activity expectations from Day 1 start counting tomorrow.", "Read your own funnel before someone reads it to you.", "Bring a real call and a real question. Every week.", "Onboarding was the rehearsal. This is the same routine, run every day, without anyone reminding you.", "No new expectations today. Everything above was set during Days 1–9."]}, {"number": 11, "title": "Your reference library", "blocks": ["WHERE TO FIND THE ANSWER", "Live onboarding taught what, when and why. The library shows how, in the tool.", "LIVE ONBOARDING TAUGHT", "THE LIBRARY SHOWS", "What to do   ·   When to do it   ·   Why it matters", "How to do it in the tool", "WHAT'S IN THERE", "HUBSPOT", "PRE-VETTING", "ORUM", "BOOKING + MEETINGS", "EMAIL + SMS", "Lists, filters, statuses, logging activity.", "Research workflow and where the notes go.", "Sessions, list selection, your own metrics.", "Scheduling, required fields, handoff notes, rescheduling.", "Sending, templates, sequences, messaging.", "You don't need to memorize every click. You need to know where to find the answer."]}, {"number": 12, "title": "You need to know how to make the next right decision.", "blocks": ["You don't need to know everything.", "UNDERSTAND.", "DECIDE.", "EXECUTE.", "LEARN.", "REPEAT.", "Welcome to the team."]}], "videos": [], "source": "resources/onboarding-day-10.pptx", "slides": [{"src": "slides/day-10-slide-01.jpg", "thumb": "slides/day-10-slide-01-thumb.jpg", "title": "Put It All Together"}, {"src": "slides/day-10-slide-02.jpg", "thumb": "slides/day-10-slide-02-thumb.jpg", "title": "The SDR system"}, {"src": "slides/day-10-slide-03.jpg", "thumb": "slides/day-10-slide-03-thumb.jpg", "title": "The workflow is a series of decisions"}, {"src": "slides/day-10-slide-04.jpg", "thumb": "slides/day-10-slide-04-thumb.jpg", "title": "From lead to meeting held"}, {"src": "slides/day-10-slide-05.jpg", "thumb": "slides/day-10-slide-05-thumb.jpg", "title": "Your Book of Business"}, {"src": "slides/day-10-slide-06.jpg", "thumb": "slides/day-10-slide-06-thumb.jpg", "title": "Prospect strategy"}, {"src": "slides/day-10-slide-07.jpg", "thumb": "slides/day-10-slide-07-thumb.jpg", "title": "The cold call"}, {"src": "slides/day-10-slide-08.jpg", "thumb": "slides/day-10-slide-08-thumb.jpg", "title": "How you're evaluated"}, {"src": "slides/day-10-slide-09.jpg", "thumb": "slides/day-10-slide-09-thumb.jpg", "title": "Coach yourself"}, {"src": "slides/day-10-slide-10.jpg", "thumb": "slides/day-10-slide-10-thumb.jpg", "title": "Your first week live"}, {"src": "slides/day-10-slide-11.jpg", "thumb": "slides/day-10-slide-11-thumb.jpg", "title": "Your reference library"}, {"src": "slides/day-10-slide-12.jpg", "thumb": "slides/day-10-slide-12-thumb.jpg", "title": "You need to know how to make the next right decision."}]}];

const articles={
selfsource:{"group": "Book of Business", "title": "Self-Sourcing & Claiming Unowned Leads", "summary": "Research first. Request ownership before making contact.", "steps": ["Search HubSpot for the company, domain, contacts, and locations before creating a record. Check existing owners and outreach history.", "If the lead is genuinely unowned, request assignment from your manager. Do not begin outreach until the manager assigns it to you.", "If there is another owner or a duplicate, pause and apply the duplicate rules. Never treat an inactive owned record as unowned.", "Use accurate company and contact associations, document research, and log every outreach touch after assignment."], "note": "Manager approval is required for ownership assignment. Multi-location ownership conflicts must be decided by a manager.", "related": "Duplicate ownership"},
sequences:{"group": "Book of Business", "title": "Manage Sequence Enrollment", "summary": "Use sequences as an outreach tool while keeping activity and ownership accurate.", "steps": ["From the relevant record, choose Enroll in a sequence and select the intended contact and sequence.", "Review the start step, time zone, timing, sender, and message before choosing Start sequence.", "To remove a contact, open the contact’s sequence enrollment and use Unenroll. Check the activity timeline for the unenrollment event.", "After a demo is held, SDR outreach must stop. Check ongoing outreach and sequence enrollment so automation does not continue prospecting after handoff.", "Enroll no-shows in the no-show sequence and continue daily recovery efforts for at least two weeks. Do not apply outreach sequences to do-not-contact records."], "note": "The sequence recording demonstrates enrollment and removal. It does not establish a universal approved cold-outreach cadence or automatic unenrollment behavior.", "related": "Booking checklist"},
statusGuide:{"group": "Book of Business", "title": "Lead Statuses & Activity Clock", "summary": "New → Attempting → Nurture → Recycled; Booked, Opportunity, Customer, Unqualified, and Dead describe other outcomes.", "steps": ["New means never touched before. Attempting means SDR outreach within 30 days.", "After 30 days without qualifying SDR activity, Attempting moves to Nurture. SDRs may also enter nurture manually.", "Nurture lasts three months before Recycled. A planned callback with a task or reminder can interrupt nurture. A documented request protects ownership.", "Booked means the demo is upcoming. Opportunity means the AE has marked SQL and moved forward. After attendance, stop SDR outreach while the account remains in the SDR book until closed-won.", "Customer accounts are not for SDR prospecting. Company-level Dead and Unqualified leave the SDR book; contact-only dead status need not remove the company."], "note": "Marketing emails do not reset the clock. SDR calls, emails, and texts through HubSpot count, including SDR-enrolled sequence activity.", "related": "CRM hygiene"},

qualification:{"group": "Qualification & SALs", "title": "Demo Qualification Requirements", "summary": "Qualify the business and attendee before booking. A held meeting must meet the parameters to become a SAL.", "steps": ["Class-Based Businesses: 8+ weekly recurring, in-person classes. The qualification sheet also lists 2+ bookable staff, with a one-staff exception for approved software. Apply the documented staff exception and escalate uncertain cases before booking.", "Service / Appointment-Based Businesses: 2+ bookable staff on the scheduling widget, in person; one bookable staff member qualifies on approved software.", "Approved One-Staff Software: MBO (Mindbody), Arketa, WellnessLiving, Glofox, and Mariana Tek. Mariana Tek is subject to the separate outreach restrictions below.", "Business Requirements: A physical location and working website are required. For a business not yet open, a signed lease must be known. The contract requirement is listed as less than six months; confirm unclear contract timing with your manager.", "Eligible Attendees: Owner, Director, Founder, Studio Manager, or Operations Manager. An instructor or front-desk attendee alone does not satisfy the listed persona requirement.", "Software Preference: Having no current booking platform does not disqualify an otherwise qualified prospect. A prospect who explicitly does not want booking software can be disqualified."], "note": "Source: US & EMEA Demo Qualification Parameters, with your current Momence policy updates. If class count and staff requirements are ambiguous in a specific case, bring the evidence to your manager before booking.", "related": "Qualification exceptions"},
qualificationExceptions:{"group": "Qualification & SALs", "title": "Verticals, Software & Exceptions", "summary": "Check both fit and software restrictions before committing AE time.", "steps": ["Core Target Verticals: Yoga, Pilates, Fitness, and Wellness. Onboarding also identifies Spas, Salons, and Dance as secondary priorities.", "Do-Not-Book Verticals in the Qualification Sheet: Pain Management Clinics, Gym, Nail Spa, Barber Shop, and Martial Arts. Day 2 additionally lists MedSpa; that difference is awaiting manager confirmation.", "Do-Not-Book Software: Gymmaster and ClubReady. Escalate uncertain software or vertical classification before booking.", "Mariana Tek: Do not actively pursue these accounts. An incidental outbound encounter may be booked if the prospect is unhappy with Mariana Tek. Inbound prospects may be booked. The one-bookable-staff exception applies to these permitted bookings.", "Evidence: Use what is on the website in the month of the demo. Where the schedule or widget is gated, use available website or LinkedIn evidence, such as a class schedule PDF, staff/about page, or job title profile.", "AE-Caused Issues: The qualification sheet flags AE no-shows, lateness without communication, and AE reschedules or handoffs that lead to a no-show/cancellation. Bring the facts to your manager for review; these events do not automatically create a SAL."], "note": "For a rejection dispute, provide the record link, rejection reason, factual counterargument, and evidence. Your manager and RSD decide together.", "related": "SAL acceptance"},
booking:{"group": "Meetings & AE Handoff", "title": "Book & Confirm a Demo in HubSpot", "summary": "Book around the prospect’s availability and complete the handoff preparation before moving on.", "steps": ["Check the company and contact history, ownership, qualification evidence, current software, and attendee role. Do not prospect into an existing customer or open opportunity.", "Use the HubSpot booking flow. Confirm the prospect’s time zone and best availability. Complete First name, Last name, Your email address (the prospect’s email), Company name, and Phone number. Aim for 0–3 days out where availability permits.", "Recap the date, time, purpose, and who will run the demo. Ask the prospect to accept the invitation while you are still speaking. If acceptance is missing, confirm delivery and arrange follow-up.", "Ensure you are on the invite. Under Add guests, enter your own email and click Add; confirm you appear in the guest list before confirming the booking. If not automatically included on an email or inbound booking, ask the AE to add you and confirm it is on your calendar.", "Open Playbooks → SDR - Meeting Set Notes. Complete the required tech-stack, reason-for-call, pain-point, and background-context fields, then Log note. Include business and attendee details, locations, qualification evidence, timeline, decision-makers, and commitments. Ensure the AE can find the note and pin it to the company record as required by the onboarding handoff guidance.", "Send an introduction email with the AE copied. Set reminder tasks, maintain your upcoming/no-show/held tracker, and confirm the meeting status in HubSpot."], "note": "The booking field names and Playbooks workflow were checked against the supplied recordings. Screens may change; follow the current required fields and preserve the information above. Check active sequence enrollment when booking or changing outreach responsibility.", "related": "Demo preparation"},
reminders:{"group": "Meetings & AE Handoff", "title": "Protect the Meeting Before It Starts", "summary": "Confirm the details, reduce joining friction, and keep your follow-up commitments.", "steps": ["If the invite is unaccepted, call to check whether it arrived, whether the email is correct, and whether it went to spam. Follow with text or email as appropriate.", "Day Before: If still unaccepted, the onboarding guide calls for two or three call attempts as appropriate, a final voicemail or gatekeeper message, and a confirmation email or text. Explain the next planned follow-up.", "Morning Of: Call ahead as appropriate to meeting time, share the Zoom link by text where appropriate, and ask the prospect to join from a laptop or tablet.", "Keep the tone assumptive and helpful. Make it easy to explain changed circumstances, without offering a reschedule the prospect has not requested.", "During PTO: Arrange peer coverage to help confirm your demos. Ask your manager to help when necessary."], "note": "All calls, emails, texts, and social outreach must be logged. Contact restrictions always apply.", "related": "No-show recovery"},
cancellation:{"group": "Meetings & AE Handoff", "title": "Handle a Cancelled Demo", "summary": "Understand why the meeting was cancelled and document a clear next step.", "steps": ["Determine whether the cancellation reflects timing, lost interest, or a request to stop contact. Respect any do-not-contact request at the contact or company level indicated.", "If the prospect still wants to meet, reschedule around their availability. Keep a meaningfully connected AE if the prospect is flexible; otherwise use round-robin.", "For a longer-term request, record the requested timing and create a task or reminder. A documented prospect callback request protects ownership during that gap.", "Document the follow-up plan and next action in HubSpot. The daily outreach and two-week minimum for no-shows do not automatically apply to cancellations."], "note": "If a demo was never held, SDR coordination continues until attendance. After attendance, the AE handles prospect communication.", "related": "Rescheduling"},
hygiene:{"group": "Book of Business", "title": "HubSpot Hygiene & Contact Restrictions", "summary": "Keep records usable, ownership clear, and every outreach touch visible.", "steps": ["Log Every Touch: Calls, texts, emails, Instagram, and other social outreach must be recorded in HubSpot.", "Activity Clock: SDR calls, emails, and texts through HubSpot reset the 30-day clock, including activity from SDR-enrolled sequences. Marketing emails do not count. Social outreach still must be logged; it counts toward the seven-day inbound-credit requirement.", "Contact-Level Dead: Bad contact details or a person-specific do-not-contact request apply to that contact. The company may remain workable through another appropriate person.", "Company-Wide Restriction: An explicit request to stop contacting the entire business applies to the whole company. Do not approach another contact to bypass it.", "Duplicate Records: Pause outreach while ownership is disputed. The booking SDR continues coordinating an already-booked meeting. A manager approves and updates ownership; the SDR handles the approved merge after training.", "Retain Context: Record meaningful connections, future callback requests, supporting qualification evidence, and next tasks so the history supports ownership and handoffs."], "note": "Never prospect into another SDR’s owned book. Three months of inactivity only affects ownership decisions when a genuine duplicate has been discovered.", "related": "Duplicate ownership"},
working:{"group": "Compensation, Ramp & Expectations", "title": "Working Hours, Activity & PTO", "summary": "The operating expectations in the onboarding materials, alongside your current coverage policy.", "steps": ["Working Hours: 8 a.m.–5 p.m. in your time zone, with a one-hour break.", "Daily Activity Floor: 140 inbound/outbound activities, including a minimum of 120 dials. Onboarding also lists 20 email-sequence enrollments and five social touches per day.", "Outcome Targets: Onboarding lists 1–2 booked meetings per day and 3–4 SQLs per week. Qualification and meeting quality remain required.", "Communication: Keep your Slack photo, status, and calendar current so teammates know when you are available.", "PTO: The onboarding policy describes unlimited PTO and four days’ notice for an extended vacation. Update Slack and Calendar. The source does not specify whether notice is calendar or business days.", "Demo Coverage: Arrange peer support to confirm upcoming demos before PTO. Escalate to your manager when necessary."], "note": "The activity floor, channel targets, working hours, and PTO wording are transcribed from Day 1 onboarding for your review. Manager-specific PIP requirements are handled individually.", "related": "Performance support"},
commission:{"group": "Compensation, Ramp & Expectations", "title": "Understand Your SDR Commission", "summary": "Use your individual monthly variable and the June 2026 SDR plan.", "steps": ["Base Commission: Monthly variable divided by quota gives the payout rate. Example only: $2,000 variable ÷ 10 SALs = $200 per SAL. The same rate applies above 100% attainment.", "Ramp: First full 30 days target four booked meetings with the correct persona; start and go-live dates affect this. The plan illustrates 75% of full monthly variable. Next 30 days: five SALs, no basement. Next 30 days: ten SALs, no basement. At 120+ days: ten SALs and a 50% basement.", "Basement: At 120+ days, finishing below half of quota means no base-commission payout for that month. Fully ramped means the first full quota month without a basement is complete.", "Payment & Tracking: Commissions are paid on the 15th of the following month. Track them in QuotaPath. Monthly statement CSVs are shared through Google Drive, with email and Slack notifications where enabled.", "Statement Questions: Comment in the statement CSV and tag your manager, Jake Riffice, and Guido Apelbaum, or Slack your manager.", "Calculator Scope: Fully ramped base commission only, before accelerators and bonuses. Senior SDR values remain as supplied in the calculator; the detailed policy is for SDRs only."], "note": "Bonuses and eligibility are shown in the Compensation section. Monthly bonus stacking and percentage-versus-count interpretation remain questions for confirmation; no bonus automation assumes an answer.", "related": "Ramp review"},

handoffSop:{"group": "Meetings & AE Handoff", "title": "Prepare & Deliver the Demo Handoff", "summary": "Give the prospect a seamless introduction and the AE the context they need.", "steps": ["Add yourself as a guest when booking through HubSpot. If not automatically included on an email or inbound booking, ask the AE to add you and confirm the invite is on your calendar.", "Prepare the prospect’s role, business, locations, vertical, current software, reason for meeting, and top 1–3 priorities. Record relevant qualification details and promises in HubSpot.", "Join on time, prepared for a customer-facing call, with appropriate clothing, a quiet setting, good lighting, and a professional background.", "Introduce the prospect to the AE. In 30–60 seconds, summarize their priorities, current setup, and desired outcome. Avoid re-pitching or repeating discovery.", "After completing the handoff, let the AE lead; you may leave the call. The AE handles discovery, product questions, deal updates, and post-demo follow-up.", "If the prospect has not joined after a few minutes, call to help them enter the existing meeting. If unsuccessful, leave a voicemail when appropriate and send a short email, or SMS where it is already part of the outreach. Continue the confirmed no-show sequence and daily follow-up for at least two weeks."], "note": "Attendance is mandatory for demos you book, except when demos overlap or fall outside your working hours. For overlapping demos, use your judgment to prioritize the strongest opportunity. For an internal-meeting conflict, notify your manager that you cannot attend and take responsibility for catching up afterward.", "related": "No-show recovery"},
noShow:{group:'Meeting management',title:'My prospect no-showed. What now?',summary:'The meeting is yours to recover until the prospect attends. A no-show does not make a lead Dead.',steps:['Reach out promptly to reconnect with the prospect and recover the meeting.','Enroll the prospect in the no-show sequence and follow up daily.','Continue your recovery efforts for at least two weeks after the no-show.','When rebooking, retain a meaningfully connected AE if the prospect is flexible. Otherwise, prioritize availability through round-robin.'],note:'The daily follow-up and two-week minimum apply to no-shows. Cancellations require a documented follow-up plan.',related:'Rescheduling & AE assignment'},
reschedule:{group:'Meeting management',title:'Who gets the rescheduled meeting?',summary:'Prioritize the prospect’s availability while preserving an established AE relationship.',steps:['Check whether the AE has meaningfully connected through a live interaction, such as a brief Zoom conversation.','If they have connected and the prospect is flexible, rebook with the same AE.','If the prospect cannot accommodate that AE, use round-robin.','Use your judgment. Manager approval is not required for this routing decision.'],note:'An AE’s name on the original invite does not establish a meaningful connection.',related:'No-show recovery'},
sal:{group:'Qualification & SALs',title:'When does a meeting count as a SAL?',summary:'A meeting must be held and meet all qualification parameters.',steps:['The AE accepts or rejects the meeting within 24 elapsed hours after the demo.','If the deadline passes without an update, the SDR or manager can follow up.','A rejection must be based on unmet qualification parameters.','To dispute a rejection, send your manager the record link, rejection reason, your factual reasoning, and supporting evidence. The manager and RSD decide together.'],note:'Example: a demo held Wednesday at 1 p.m. must be updated by Thursday at 1 p.m. Only one SDR receives credit per SAL.',related:'Qualification exceptions'},
duplicate:{group:'Book of business',title:'Two SDRs own a duplicate account.',summary:'Pause outreach, compare the history, and resolve ownership before continuing.',steps:['If both SDRs are active, ownership generally goes to whoever began outreach first. Meaningful connections may warrant a manager-decided exception.','If only one SDR has been working the lead and discovers the duplicate, ownership goes to that SDR.','Three months or more of inactivity may favor the actively working SDR. A documented future callback request protects ownership.','SDRs may agree on clear duplicate cases themselves. Escalate disagreement or a meaningful-connection exception to a manager. Managers approve and change ownership; the SDR handles the approved merge after training. Multiple-location ownership disputes must be decided by a manager.'],note:'Pause outreach until ownership is resolved; the booking SDR continues coordinating an already-booked meeting. For SDR ownership, meaningful connection means a real conversation or two-way email/text exchange. New information discovered during a call follows the same duplicate rules. Inactivity never makes an ordinary assigned account available to another SDR.',related:'Self-sourcing checks'},
performance:{group:'Team expectations',title:'Ramp reviews & performance support',summary:'Understand when performance is reviewed and how improvement plans are handled.',steps:['A performance review takes place at the end of the first three months.','Below 70% quota attainment over a rolling 90-day period may lead to a performance improvement plan.','The manager decides whether to begin a plan or allow additional time, such as another month, to improve.','Individual monthly goals and progression requirements are set by the manager.'],note:'Detailed improvement-plan targets are not included in this handbook.',related:'Compensation & ramp'},
postdemo:{group:'AE handoff & post-demo',title:'The prospect attended. Who owns next steps?',summary:'The AE owns prospect communication after attendance.',steps:['Stop SDR outreach once the prospect attends the demo.','The AE handles communication and next steps.','The account remains in the SDR’s book unless it becomes closed-won.'],note:'See Prepare & Deliver the Demo Handoff for the live introduction. Attendance is mandatory, subject to the exceptions in the handoff guide.',related:'SAL acceptance'},
inbound:{"group": "Book of Business", "title": "Who Works This Inbound Lead?", "summary": "Identify the inbound type, check ownership, and confirm credit eligibility separately.", "steps": ["Free Signups — A prospect creates a free demo sandbox account within Momence. These route to senior SDRs. If the lead is already owned by an SDR, that SDR may retain ownership.", "Demo Abandoned — A prospect starts signing up for a demo but leaves without completing the booking. These route to senior SDRs. If the lead is already owned by an SDR, that SDR may retain ownership.", "Reassign No-Show or Cancel — A demo was on the calendar but did not happen. The lead routes to an SDR to rebook.", "Check HubSpot before outreach. Do not work open opportunities or existing customers. Assignment and permission to work a lead do not automatically establish credit."], "note": "Inbound Credit: For any inbound event on a lead an SDR is already working, that SDR is eligible for credit only if they made a call, sent a text or email, or performed social outreach within the seven days before the inbound event. All outreach must be logged. This is a credit requirement, separate from assignment and ownership; the meeting must still be held and meet SAL qualification criteria.", "related": "SAL acceptance"}
};

function courseViewer(d){

}
function changeCourseSlide(index){
 const viewer=main.querySelector('.deck-viewer');if(!viewer)return;
 const d=courseDays.find(x=>x.day===Number(viewer.dataset.deck));index=Math.max(0,Math.min(d.slides.length-1,index));coursePositions[d.day]=index;
 const image=viewer.querySelector('.deck-main-image');image.src=d.slides[index].src;image.alt='Day '+d.day+', slide '+(index+1)+': '+d.slides[index].title;
 viewer.querySelector('.deck-counter').textContent='Slide '+(index+1)+' of '+d.slides.length;
 viewer.querySelector('[data-slide-step="-1"]').disabled=index===0;viewer.querySelector('[data-slide-step="1"]').disabled=index===d.slides.length-1;
 viewer.querySelectorAll('[data-slide-index]').forEach((b,i)=>b.setAttribute('aria-pressed',String(index===i)));
 viewer.querySelector('[data-slide-index="'+index+'"]').scrollIntoView({behavior:'smooth',block:'nearest',inline:'nearest'});
}

const title=page==='statuses'?'Lead Statuses & CRM':page==='inbound'?'Inbound Routing':page==='calculator'?'Earnings Calculator':topics.find(t=>t[0]===page)[2];main.innerHTML='<div class="crumb">Playbook / '+title+'</div><h1>'+title+'</h1>'+search();

['New','Never touched by anyone before.','Review and pre-vet before starting outreach.','Assigned SDR'],

].map((x,i)=>'<details class="statusitem" '+(i<2?'open':'')+'><summary>'+x[0]+'</summary><div class="statusbody"><p>'+x[1]+'</p><div class="label">Your next move</div><p>'+x[2]+'</p><div class="label">Ownership</div><p>'+x[3]+'</p></div></details>').join('')+'</div><details class="policy"><summary>What counts as activity?</summary><p>SDR calls, emails, and texts through HubSpot count, including activity from an SDR-enrolled sequence. Marketing emails do not reset the clock. All outreach—including social outreach—must still be logged.</p></details>';
