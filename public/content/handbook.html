else if(page==='calculator')main.innerHTML='<button class="textbutton" data-page="pay">← Back to Compensation, Ramp & Expectations</button><h1>Earnings Calculator</h1><p>Explore current activity and what-if scenarios. Both SDR and Senior SDR options are available.</p><iframe src="earnings-calculator.html" title="SDR Earnings Calculator" style="width:100%;height:1250px;border:1px solid var(--line);border-radius:14px;background:white"></iframe>';
else if(page==='pay')main.innerHTML+='<p>Your expectations, development, and compensation in one place.</p><button class="tile" data-page="calculator"><span class="icon">↗</span><h3>Earnings Calculator</h3><p>Compare activity, accepted meetings, and estimated earnings →</p></button><div class="groupintro"><h2>Ramp & performance</h2></div>'+row('performance')+row('commission')+'<details class="policy"><summary>SDR Commission & Payment</summary><p>Monthly variable ÷ monthly quota = payout per SAL. For example, a $2,000 variable and 10-SAL quota produces $200 per SAL. Use your individual variable; $2,000 is an example. The same rate applies above 100% attainment.</p><p>Commissions are paid on the 15th of the following month. Track them in QuotaPath; monthly statements arrive as CSV files shared through Google Drive. Raise statement questions with your manager.</p></details><details class="policy"><summary>SDR Ramp Schedule</summary><p><strong>First full 30 days:</strong> 4 meetings booked with the correct persona, depending on start and go-live dates. The plan illustrates 75% of full monthly variable.</p><p><strong>Next 30 days:</strong> 5 SALs, no basement.<br><strong>Next 30 days:</strong> 10 SALs, no basement.<br><strong>120+ days:</strong> 10 SALs, with a 50% basement. Below half the quota means no base-commission payout.</p><p>Fully ramped means completing the first full-quota month without a basement.</p></details><details class="policy"><summary>SDR Bonuses & Eligibility</summary><p><strong>Closed-won:</strong> $500 for sourcing $10,000 in revenue in a month.<br><strong>SQL rate:</strong> $600 at 70%+ SQL rate, with at least 80% monthly SAL quota attainment.<br><strong>Monthly attainment I:</strong> $500 at 116% or 12 SALs.<br><strong>Monthly attainment II:</strong> $750 at 133% or 14 SALs.<br><strong>Quarterly attainment:</strong> $2,000 at 116%+, outbound lead source only.</p><p>The SQL, monthly attainment, and quarterly bonuses require fully ramped eligibility. The calculator excludes all bonuses. Whether monthly tiers stack, and how percentage versus SAL thresholds apply, still need confirmation before bonus automation.</p></details><div class="note">Source: Momence SDR Commission, June 2026. Detailed policy above is for SDRs only. Senior SDR calculator values remain as supplied; no senior plan was provided.</div><div class="groupintro"><h2>Working together</h2></div><details class="policy" open><summary>PTO & demo coverage</summary><p>Arrange peer coverage to help confirm your demos while you are away. Ask your manager to assist when necessary.</p></details>'+row('working')+row('hygiene')+'';
else if(page==='sal')main.innerHTML+='<p>Check business fit, verify the evidence, and understand how acceptance and credit work.</p>'+['qualification','qualificationExceptions','sal'].map(row).join('');

else if(page==='book')main.innerHTML+='<p>Your territory, your ownership, and a clear next step for every lead.</p><div class="groupintro"><h2>Ownership Basics</h2></div><details class="policy" open><summary>Your book stays yours</summary><p>SDRs generally begin with 1,500–2,500 leads, depending on team size and availability. Ownership covers the company or studio, contacts, and locations. Dead and unqualified leads leave your book; closed-won accounts transition to the AE and CS team.</p></details><details class="policy"><summary>Before you self-source</summary><p>Check HubSpot for existing ownership and activity before creating a record or requesting ownership. Your manager must assign an unowned lead to you before you begin outreach.</p></details><details class="policy"><summary>How distribution works</summary><p>RevOps determines allocations based on available leads and team size, accounting for the current vertical mix in each book. When an SDR leaves, RevOps redistributes their leads or places them in a reserve bank.</p></details>'+row('selfsource')+row('hygiene')+row('sequences')+'<div class="groupintro"><h2>Explore Your Book</h2></div><div class="grid"><button class="tile" data-page="statuses"><span class="icon">'+icon('route')+'</span><h3>The Lead Lifecycle</h3><p>Explore statuses, ownership, and next actions →</p></button><button class="tile" data-article="duplicate"><span class="icon">'+icon('git-merge')+'</span><h3>Resolve A Duplicate</h3><p>Who owns it, who decides, and when to pause →</p></button></div><button class="row" data-article="inbound"><span>Inbound Routing<small>Free sign-ups, demo abandons, and existing owners</small></span>→</button><div class="note">Three months of inactivity is an ownership consideration only when a genuine duplicate is discovered. It does not make another SDR’s book available to prospect.</div>';

else main.innerHTML+=(page==='book'?'<button class="row" data-page="statuses"><span>Lead statuses & CRM<small>Understand the lifecycle and your next action</small></span>→</button>':'')+(groups[page]||[]).map(row).join('');
}icons();}
function tutorialLinks(k){const names=k==='booking'?['Booking A Meeting','Booking A Meeting Pt 2']:k==='sequences'?['Adding And Removing From Sequence']:k==='hygiene'||k==='statusGuide'?['Changing Lead Status']:[];return names.map(name=>{const i=tutorialVideos.findIndex(v=>v.title===name);return i<0?'':'<button class="row" data-tutorial="'+i+'"><span>Watch: '+esc(name)+'<small>HubSpot Tutorial</small></span>▶</button>';}).join('');}
function article(k){const a=articles[k];if(k==='inbound'){main.innerHTML='<button class="textbutton" data-page="book">← Back to Book of Business</button><div class="crumb">Book of Business / Inbound Routing</div><h1>Who Works This Inbound Lead?</h1><p>'+a.summary+'</p><div class="article"><h2>Inbound Lead Types</h2><h3>Free Signups</h3><p>A prospect creates a free demo sandbox account within Momence.</p><h3>Demo Abandoned</h3><p>A prospect starts signing up for a demo but leaves without completing the booking.</p><h3>Reassign No-Show or Cancel</h3><p>A demo was on the calendar but did not happen. It is routed to an SDR to rebook.</p></div><div class="article"><h2>Who Gets and Works Each Lead?</h2><h3>Senior SDRs</h3><p>Free Signups and Demo Abandoned leads route to senior SDRs.</p><h3>Existing SDR Owners</h3><p>If a Free Signup or Demo Abandoned lead already belongs to an SDR, that SDR may retain ownership.</p><h3>SDRs</h3><p>Reassign No-Show or Cancel leads route to SDRs for rebooking.</p><h3>Check Before Outreach</h3><p>Check HubSpot ownership and history first. Do not prospect into open opportunities or existing customers.</p></div><div class="note"><h2>Who Gets Credit? The Seven-Day Rule</h2>'+a.note.replace('Inbound Credit: ','')+'</div><div class="sectionhead"><h2>Related Guidance</h2></div>'+row('sal');icons();return;}main.innerHTML='<button class="textbutton" data-page="'+current+'">← Back to '+(topics.find(t=>t[0]===current)||topics[0])[2]+'</button><div class="crumb">'+a.group+'</div><span class="pill">Rule reference</span><h1>'+a.title+'</h1><p>'+a.summary+'</p><div class="article"><h2>What to do</h2><ol>'+a.steps.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol></div><div class="note">'+a.note+'</div><div class="sectionhead"><h2>Related guidance</h2></div>'+row(k==='reschedule'?'noShow':k==='noShow'?'reschedule':k==='sal'?'qualification':k==='duplicate'?'hygiene':k==='performance'?'working':k==='booking'?'handoffSop':k==='commission'?'performance':'sal')+tutorialLinks(k)+'<div class="footer"><span>Momence SDR Handbook</span><span>Content Review Version</span></div>';icons();}
shell.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.slideIndex!==undefined){changeCourseSlide(Number(b.dataset.slideIndex));return;}if(b.dataset.slideStep){const d=Number(main.querySelector('.deck-viewer').dataset.deck);changeCourseSlide((coursePositions[d]||0)+Number(b.dataset.slideStep));return;}if(b.hasAttribute('data-expand-deck')){const viewer=main.querySelector('.deck-viewer');if(document.fullscreenElement){document.exitFullscreen();b.textContent='⤢ Expand Viewer';}else if(viewer.classList.contains('deck-expanded')){viewer.classList.remove('deck-expanded');b.textContent='⤢ Expand Viewer';}else if(viewer.requestFullscreen){viewer.requestFullscreen().then(()=>b.textContent='⤡ Exit Expanded View').catch(()=>{viewer.classList.add('deck-expanded');b.textContent='⤡ Exit Expanded View';});}else{viewer.classList.add('deck-expanded');b.textContent='⤡ Exit Expanded View';}return;}if(b.dataset.facilitator){const target=main.querySelector('.facilitator-notes');target.textContent='Loading notes…';fetch('/api/facilitator/'+b.dataset.facilitator).then(async r=>{if(!r.ok)throw new Error('Facilitator notes are available to the handbook administrator.');return r.json();}).then(data=>{target.innerHTML=data.notes.map(n=>'<details class="policy"><summary>Lesson '+n.slide+': '+esc(n.title)+'</summary><p>'+esc(n.notes).replaceAll('\n','<br>')+'</p></details>').join('');}).catch(e=>target.textContent=e.message);return;}if(b.dataset.tutorial!==undefined){render('tutorials');main.querySelector('[data-video="'+b.dataset.tutorial+'"]').click();return;}if(b.dataset.video!==undefined){const v=tutorialVideos[Number(b.dataset.video)],p=main.querySelector('.video-player');p.innerHTML='<h2>'+esc(v.title)+'</h2><video controls playsinline preload="metadata" style="width:100%;max-height:480px;background:#171720;border-radius:12px;margin-bottom:24px" src="'+v.src+'" aria-label="'+esc(v.title)+'"></video>';p.scrollIntoView({behavior:'smooth',block:'nearest'});}if(b.dataset.page)render(b.dataset.page);if(b.dataset.article)article(b.dataset.article);if(b.dataset.action==='tutorial')main.querySelector('.note').textContent='Playback is not connected in this UI preview. The uploaded tutorial will appear here in production.';if(b.dataset.action==='revoke'){b.closest('.row').querySelector('small').textContent='Access revoked · simulation';b.disabled=true;b.textContent='Revoked';}if(b.dataset.action==='add'){const f=main.querySelector('.accessform');f.hidden=false;f.innerHTML='<form class="addform"><label><input class="field" type="email" required placeholder="teammate@company.com" aria-label="Approved email"></label><button class="secondary">Preview adding member</button></form>';}});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement){const button=main.querySelector('[data-expand-deck]');if(button)button.textContent='⤢ Expand Viewer';}});
shell.addEventListener('keydown',e=>{if(!main.querySelector('.deck-viewer')||e.target.matches('input,textarea,select'))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const d=Number(main.querySelector('.deck-viewer').dataset.deck);changeCourseSlide((coursePositions[d]||0)+(e.key==='ArrowRight'?1:-1));}});
shell.addEventListener('input',e=>{if(!e.target.matches('.search'))return;const q=e.target.value.trim().toLowerCase(),r=main.querySelector('.results');const norm=v=>v.toLowerCase().replace(/[^a-z0-9]+/g,' ');const tokens=norm(q).split(' ').filter(Boolean);const hits=Object.keys(articles).filter(k=>tokens.every(t=>norm(JSON.stringify(articles[k])).includes(t)));const dayHits=courseDays.filter(d=>tokens.every(t=>norm(d.title+' '+d.intro+' '+JSON.stringify(d.sections)).includes(t)));const videoHits=tutorialVideos.map((v,i)=>({v,i})).filter(({v})=>tokens.every(t=>norm(v.title).includes(t)));r.innerHTML=q?'<h2>Search results</h2>'+(hits.length||videoHits.length||dayHits.length?hits.map(row).join('')+dayHits.map(d=>'<button class="row" data-page="day-'+d.day+'"><span>Day '+d.day+': '+esc(d.title)+'<small>Onboarding</small></span>→</button>').join('')+videoHits.map(({v,i})=>'<button class="row" data-tutorial="'+i+'"><span>'+esc(v.title)+'<small>Tutorial</small></span>▶</button>').join(''):'<p>No matching rules. Try “no-show,” “credit,” or “duplicate.”</p>'):'';icons();});
shell.addEventListener('submit',e=>{e.preventDefault();if(e.target.matches('.loginform')){main.querySelector('.login').innerHTML='<span class="pill">Email verification</span><h1>Check your inbox.</h1><p>Enter the six-digit code from your sign-in email.</p><label>Verification code<input class="field" inputmode="numeric" placeholder="000000" maxlength="6"></label><button class="primary" data-page="home">Preview verified access</button><div class="note">Simulation only. No code was sent and access is not secured in this mockup.</div>'; }if(e.target.matches('.addform')){main.querySelector('.note').textContent='Approved-member addition previewed. No invitation sent or real access granted.';main.querySelector('.accessform').hidden=true;}});
render('home');
});
const design={rounding:16};if(globalThis.Tweak){const t=new Tweak({container:root,onChange:()=>root.querySelectorAll('.shell').forEach(s=>s.style.borderRadius=design.rounding+'px')});t.addSlider(design,'rounding',{label:'Window corners',min:0,max:24,unit:'px'});}
})();
</script>
