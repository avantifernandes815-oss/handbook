"One set you choose every day. The other follows from it.", "LEADING", "RESULTS", "Things you choose today", "What those behaviors produce", "Activity", "Meetings", "Preparation", "SALs", "influence", "Conversations", "SQLs", "Follow-up", "Revenue", "Execution", "This is where the work shows up. You get here through the left column.", "You cannot control whether someone buys.  You can control the behaviors that consistently create the opportunity."]}, {"number": 10, "title": "120 Calls Is Not the Job", "blocks": ["THE STANDARD", "Hitting the floor makes you compliant. Quality is what makes you good.", "ACTIVITY", "QUALITY", "QUALIFIED PIPELINE", "creates opportunity", "decides how much converts", "the only real output", "120 calls, no prep", "120 calls, pre-vetted", "Wrong personas, unvetted list", "Right persona, right business type", "Same pitch to every business", "A relevant reason for this call", "Meetings booked that don't survive AE review", "Meetings the AE accepts and advances", "Activity without conversion.", "Same effort. Completely different month.", "Volume gets you at-bats. Quality is what turns them into pipeline."]}, {"number": 11, "title": "Ramp Expectations", "blocks": ["YOUR RAMP", "Expectations rise as capability rises", "Quota grows with you. Here's exactly what's expected, and when.", "120+ DAYS", "NEXT 30  ·  90 DAYS", "NEXT 30  ·  60 DAYS", "FIRST FULL 30 DAYS", "SALs", "SALs", "50% basement applies", "SALs", "No basement", "Meetings Booked", "No basement", "Depends on your start and go-live date", "New Hire Onboarding", "Initial Outreach", "Qualifying Leads", "Fully ramped + all future months", "Fully Ramped = your first full quota month completed without a basement.   Basement = 50% of that month's quota.   At the end of month 3 there is a performance review."]}, {"number": 12, "title": "Compensation", "blocks": ["HOW YOU GET PAID", "MONTHLY VARIABLE", "÷", "MONTHLY QUOTA", "PAYOUT RATE", "what you can earn", "what you're asked for", "what each one pays", "WORKED EXAMPLE  ·  MONTH 3", "TWO RULES TO REMEMBER", "Monthly variable", "$2,000", "The same payout rate applies above 100% to goal.", "Monthly SAL quota", "10 SALs", "From 120 days on, a 50% basement applies: finish below half your quota and there is no payout for the month.", "Payout rate", "$2,000 ÷ 10  =  $200 per SAL", "You close 8 SALs  →  8 × $200 = $1,600", "PAID", "TRACKED", "STATEMENTS", "The 15th of the month after you earn it", "QuotaPath, live through the month", "Monthly CSV from Google Drive — email, Slack, or “Shared with me”", "Questions on a statement: comment directly in the statement CSV and tag your manager — or Slack your manager.", "Also tag jake.riffice@xplortechnologies.com and guido.apelbaum@xplortechnologies.com."]}, {"number": 13, "title": "How you earn more", "blocks": ["ACCELERATORS", "Four ways to get paid beyond your monthly variable. Each rewards a different behavior.", "QUALITY", "$600", "PERFORMANCE", "SQL Rate 70%+", "Monthly quota over-attainment", "Your SALs that become SQLs", "116% or 12 SALs — $500", "Must be at 80%+ of monthly SAL quota to qualify", "133% or 14 SALs — $750", "$500", "$2,000", "REVENUE", "CONSISTENCY", "Closed Won bonus", "Quarterly SAL quota 116%+", "Source $10,000 of revenue in any given month", "Outbound lead source only", "Eligibility: SQL Rate, Monthly Quota Attainment and Quarterly SAL Attainment all require you to be Fully Ramped — your first full quota month completed without a basement.", "The SQL Rate accelerator additionally requires 80% or more of monthly SAL quota. Quarterly attainment is outbound lead source only."]}, {"number": 14, "title": "Learn from real calls", "blocks": ["ASSIGNMENT  ·  DUE FRIDAY", "You're not grading these. You're pattern-matching — finding what good actually sounds like.", "5–8", "SDR calls in Orum", "demos in Clari", "Make sure both parties are recorded", "Rate each one and take notes", "LISTEN FOR THESE SIX THINGS", "How did the rep open?", "When did the prospect engage?", "Which questions worked?", "First 10 seconds. What earned the next 30?", "Find the exact moment they leaned in.", "And which ones got a one-word answer.", "What created relevance?", "Where did it turn?", "What would you do differently?", "Why did this call matter to this business?", "The moment the call changed direction — either way.", "Say it out loud. That's the whole exercise.", "You don't need to know how to run these calls yet. You need to start hearing the difference. We'll show you how to access both tools."]}, {"number": 15, "title": "Day 1 Takeaways", "blocks": ["DAY 1 TAKEAWAY", "Understand your role.", "TOMORROW", "Who We Sell To\n+ Why", "Understand the funnel.", "You'll connect your role to the businesses and people you'll actually prospect — and learn your first real methodology:", "Understand what you control.", "How to pre-vet a lead.", "You'll receive your leads and start building the pool of prospects you'll eventually call.", "Everything in the next nine days hangs off these three."]}], "videos": [], "source": "resources/onboarding-day-1.pptx", "slides": [{"src": "slides/day-01-slide-01.jpg", "thumb": "slides/day-01-slide-01-thumb.jpg", "title": "Welcome to Sales at Momence"}, {"src": "slides/day-01-slide-02.jpg", "thumb": "slides/day-01-slide-02-thumb.jpg", "title": "How We Work"}, {"src": "slides/day-01-slide-03.jpg", "thumb": "slides/day-01-slide-03-thumb.jpg", "title": "Your First Two Weeks"}, {"src": "slides/day-01-slide-04.jpg", "thumb": "slides/day-01-slide-04-thumb.jpg", "title": "One prospect, four words"}, {"src": "slides/day-01-slide-05.jpg", "thumb": "slides/day-01-slide-05-thumb.jpg", "title": "SDRs create qualified pipeline"}, {"src": "slides/day-01-slide-06.jpg", "thumb": "slides/day-01-slide-06-thumb.jpg", "title": "To book the right meeting, with the right person, at the right time."}, {"src": "slides/day-01-slide-07.jpg", "thumb": "slides/day-01-slide-07-thumb.jpg", "title": "How an SDR creates revenue"}, {"src": "slides/day-01-slide-08.jpg", "thumb": "slides/day-01-slide-08-thumb.jpg", "title": "The metrics behind the funnel"}, {"src": "slides/day-01-slide-09.jpg", "thumb": "slides/day-01-slide-09-thumb.jpg", "title": "Leading indicators vs. results"}, {"src": "slides/day-01-slide-10.jpg", "thumb": "slides/day-01-slide-10-thumb.jpg", "title": "120 Calls Is Not the Job"}, {"src": "slides/day-01-slide-11.jpg", "thumb": "slides/day-01-slide-11-thumb.jpg", "title": "Ramp Expectations"}, {"src": "slides/day-01-slide-12.jpg", "thumb": "slides/day-01-slide-12-thumb.jpg", "title": "Compensation"}, {"src": "slides/day-01-slide-13.jpg", "thumb": "slides/day-01-slide-13-thumb.jpg", "title": "How you earn more"}, {"src": "slides/day-01-slide-14.jpg", "thumb": "slides/day-01-slide-14-thumb.jpg", "title": "Learn from real calls"}, {"src": "slides/day-01-slide-15.jpg", "thumb": "slides/day-01-slide-15-thumb.jpg", "title": "Day 1 Takeaways"}]}, {"day": 2, "title": "Who We Sell To & Why", "intro": "Recognize the right businesses, people, and reasons to talk.", "practice": ["Begin pre-vetting your assigned leads.", "Use the business, persona, and problem-to-value framework.", "Continue pre-vetting in available time through Day 9."], "amendments": ["Mariana Tek is exception-based: no active targeting; permitted for inbound or incidental outbound where the prospect is unhappy. Its one-bookable-staff exception applies.", "Qualification questions on class/staff conjunction, contract timing, and MedSpa exclusion are awaiting confirmation. Follow current handbook exceptions and escalate uncertain cases."], "sections": [{"number": 1, "title": "Who We Sell To + Why", "blocks": ["BY THE END OF TODAY\nYOU CAN ANSWER", "Is this the type of business Momence should pursue?", "Who should I contact?", "Before you can prospect well, you have to know who deserves your\nattention — and why they'd care.", "Why might this prospect care about Momence?", "YESTERDAY", "TODAY", "Is there enough evidence to spend time here?", "Understand your role.", "Understand your customer."]}, {"number": 2, "title": "Who we sell to", "blocks": ["PATTERN RECOGNITION", "Two types of business. Two tiers of priority.", "CLASS BASED", "SERVICE / APPOINTMENT BASED", "Runs recurring group classes, in person.", "Books individual appointments with staff.", "A pilates studio with a published weekly class schedule.", "A wellness practice with bookable practitioners.", "Yoga   ·   Pilates   ·   Fitness   ·   Wellness", "PRIORITY 1", "Spas   ·   Salons   ·   Dance studios", "Real customers — we just lead with Priority 1\nwhile product capabilities catch up.", "PRIORITY 2", "NOT IN SCOPE   Pain Management Clinics · Gym · Nail Spa · Barber Shop · MedSpa · Martial Arts"]}, {"number": 3, "title": "Understand their business before our product", "blocks": ["THE MINDSET", "Six questions you should be able to answer from the outside, before you ever dial.", "How do they make money?", "What are they actually selling?", "How do clients book?", "What brings clients back?", "Who does the work behind the scenes?", "What are they trying to grow?", "These are not questions you ask on a call. They're the picture you build before it."]}, {"number": 4, "title": "What each question tells you", "blocks": ["WHY EACH ONE MATTERS", "Same six questions. Here's what you're actually listening for.", "How do they make money?", "What are they actually selling?", "How do clients book?", "Class packs, memberships, single appointments — it changes what matters to them.", "Classes or appointments. That one answer changes the whole conversation.", "Website, widget, phone, DM. This is where the friction usually lives.", "What brings clients back?", "Who does the work behind the scenes?", "What are they trying to grow?", "A first visit is easy. The second and tenth are the business.", "Someone is doing scheduling and follow-up by hand. Usually the owner.", "More clients, more classes, more locations — or just fewer hours.", "Momence doesn't enter the conversation until you understand the business it's supposed to help."]}, {"number": 5, "title": "What problems are we solving?", "blocks": ["VALUE, NOT FEATURES", "Four themes. The business problem on top — what Momence does about it underneath.", "GROWTH", "RETENTION", "THE PROBLEM", "THE PROBLEM", "Growth is capped by whatever the owner can personally handle.", "Clients come once and are never heard from again.", "MOMENCE", "MOMENCE", "Memberships and packs, payments and point of sale, reviews — built to convert more leads into members.", "Automated sequences across the customer journey, on-demand content, community posts.", "TIME / ADMIN", "CLIENT EXPERIENCE", "THE PROBLEM", "THE PROBLEM", "Hours a week disappear into scheduling and chasing people down.", "Booking is clunky and client messages get missed.", "MOMENCE", "MOMENCE", "Class and appointment scheduling in one place, automations, staff management, reporting.", "Two-way SMS, email and in-app messaging. Website plugins and a mobile app.", "Capabilities sourced from momence.com. Deeper product training comes later in onboarding."]}, {"number": 6, "title": "Three problems, over and over", "blocks": ["WHAT YOU'LL ACTUALLY HEAR", "These come up on real calls. Know them cold.", "THE SOFTWARE STILL MAKES THEM DO THE WORK", "BOOKING IS A CHORE FOR THE CLIENT", "THEY'RE PAYING FOR FOUR TOOLS, NOT ONE", "Their current platform leaves the owner doing it by hand — confirmations, follow-ups, chasing people down. It costs them time, it costs them revenue, and things slip through the cracks.", "On other platforms booking runs upwards of 8 steps and forces the client to create an account. A first-time client gives up before they ever book.", "It isn't just the booking software. It's lead generation, marketing, billing — separate tools, separate bills, and data moved back and forth between them.", "Automations handle the follow-up. The owner stops being the system.", "Two clicks — and we still capture everything the business needs.", "All of it in one platform. No more going back and forth between systems.", "Notice what none of these are: a feature request. Every one of them is time, money, or a client they lost."]}, {"number": 7, "title": "Problem → Impact → Value", "blocks": ["THE MESSAGING FRAMEWORK", "One framework you'll use for the rest of onboarding. Learn it today.", "PROBLEM", "IMPACT", "VALUE", "What isn't working?", "Why does it matter to the business?", "How could Momence help?", "ONE EXAMPLE  ·  A PILATES STUDIO TAKING BOOKINGS BY TEXT", "PROBLEM", "IMPACT", "VALUE", "Bookings come in by text and DM. Someone sorts them by hand every day.", "Hours a week on admin. Missed messages. Clients who never make it onto the schedule.", "Booking runs off their own website. Client messaging lives in the same place.", "VALUE is a hypothesis until they confirm it. You're opening a conversation, not diagnosing a business."]}, {"number": 8, "title": "You have the problem. Find the rest.", "blocks": ["YOUR TURN", "Four real problems. For each one: what's the impact on the business, and what's the Momence value?", "PROBLEM", "PROBLEM", "PROBLEM", "PROBLEM", "Booking takes more than 8 steps and requires an account.", "Leads get exported from one platform and imported into another.", "The owner confirms every appointment by hand each morning.", "They pay separately for scheduling, marketing and billing.", "IMPACT", "IMPACT", "IMPACT", "IMPACT", "?", "?", "?", "?", "VALUE", "VALUE", "VALUE", "VALUE", "?", "?", "?", "?", "Impact is what it costs them. Value is the one thing Momence changes about it. One sentence each — no feature lists."]}, {"number": 9, "title": "What is our ICP?", "blocks": ["IDEAL CUSTOMER PROFILE", "Our ICP is the shape defined by our Demo Qualification Parameters. Four signals tell you most of it.", "BUSINESS TYPE", "VERTICAL", "REAL OPERATION", "SIZE SIGNAL", "Class based, or service / appointment based.", "Priority 1: Yoga · Pilates · Fitness · Wellness", "A physical location.", "8+ weekly recurring classes,", "In person.", "Priority 2: Spas · Salons · Dance studios", "A working website.", "or 2+ bookable staff.", "ALSO CHECKED", "Contract: less than 6 months   ·   Not yet open: signed lease must be known   ·   Not on Gymmaster, ClubReady or Mariana Tek", "ICP is a pattern you learn to see — not a checklist you tick.", "After thirty of these you'll know inside ten seconds whether a business is ours. That instinct is the point of pre-vetting."]}, {"number": 10, "title": "ICP does not mean qualified", "blocks": ["AN IMPORTANT DISTINCTION", "Two different questions, asked at two different moments.", "ICP", "QUALIFICATION", "“Is this business worth pursuing?”", "“Does this opportunity meet the parameters?”", "Does it look like the businesses we serve?", "Meets the Demo Qualification Parameters.", "Right type, right vertical, real operation.", "everything you do\nin between", "Backed by evidence you can actually point to.", "Answered from the outside, before you dial.", "Booked with a qualifying job title.", "WORTH YOUR TIME", "WORTH AN AE'S TIME", "Every qualified meeting starts inside ICP. Not every ICP business becomes a qualified meeting.   A demo that fails the parameters never becomes a SAL."]}, {"number": 11, "title": "The right business is only half of it", "blocks": ["WHO YOU'RE TRYING TO REACH", "Picture a pilates studio: the founder owns the software decision, the studio manager owns the schedule.", "DECISION-MAKERS & OPERATORS", "STAFF", "NO NAME YET", "Owner", "Instructors", "No named contact", "Founder", "Front desk", "No reachable title", "Director", "Bookable staff", "No route in", "Studio Manager", "Operations Manager", "A meeting only qualifies with one of these titles.", "They'll tell you how the business really runs, and they can route you. A meeting booked with them doesn't qualify.", "Right business, no name yet. Call the main line and ask who runs their scheduling.", "Right business + wrong contact = a meeting that doesn't survive AE review.   Persona isn't a formality. It's half the qualification."]}, {"number": 12, "title": "What makes a meeting qualified?", "blocks": ["THE REASONING BEHIND THE RULES", "Four checks. Each one exists for a reason — learn the reason and you won't need the table.", "Enough activity", "8+ weekly recurring classes, in person. Or 2+ bookable staff — 1 counts only if they're already on MBO, Arketa, WellnessLiving, Glofox or Mariana Tek. Mariana Tek follows the permitted-booking exception, not active prospecting.", "Scheduling is a real daily problem here, not a hypothetical one.", "A real business", "A physical location and a working website. Not yet open? The signed lease must be known.", "We can verify it exists and see how it actually operates.", "The right person", "Owner, Director, Founder, Studio Manager or Operations Manager.", "Someone who can actually make a decision about their software.", "Able to act", "Contract: less than 6 months.", "The timing works for a deal an AE can realistically run.", "WHAT COUNTS AS EVIDENCE", "SOFTWARE PREFERENCE", "What's on the website in the month the demo takes place. If the schedule or widget isn't public: the website or LinkedIn, a class schedule PDF, the about-us page, LinkedIn job titles.", "Having no booking platform today is fine — they still qualify. A prospect who says they won't use booking software is a reason to disqualify. Those are not the same thing."]}, {"number": 13, "title": "Why would someone talk to us?", "blocks": ["FROM QUALIFICATION TO MESSAGING", "Follow one prospect down the page. Each line is built from the line above it.", "A pilates studio running 14 weekly classes out of one location.", "THEIR BUSINESS", "THEIR PROBLEM", "Every booking arrives as a DM, and someone sorts them by hand.", "That's hours a week — and clients who never make it onto the schedule.", "POSSIBLE IMPACT", "MOMENCE RELEVANCE", "Booking could run straight off their own website instead.", "“Would it be worth fifteen minutes to see how that works?”", "REASON TO KEEP TALKING", "Lines 1 to 4 are homework — done before you dial. Line 5 is the only thing you actually say first."]}, {"number": 14, "title": "Building a repeatable framework", "blocks": ["HOW WE TALK ABOUT MOMENCE", "Don't memorize a pitch. Learn the four parts and rebuild them for every prospect.", "WHO WE HELP", "PROBLEM / NEED", "RELEVANT VALUE", "REASON TO CONTINUE", "FIXED", "CHANGES EVERY TIME", "CHANGES EVERY TIME", "FIXED", "“Momence is an all-in-one platform designed to simplify operations for wellness businesses.”", "The thing you found while pre-vetting — said in their language, about their business.", "The one capability that matches their problem. One. Not the list.", "“Do you have time this week so we can show you how Momence can help save you time and grow your business?”", "Parts 1 and 4 barely change. Parts 2 and 3 change with every single prospect.   That's where your pre-vetting work shows up.", "You won't always find something. Some websites tell you nothing. When pre-vetting gives you no specific hook, fall back on what you know is true of their industry, of the competitor they're running on, or of the problems businesses like theirs always have. A relevant generalization beats a generic pitch."]}, {"number": 15, "title": "Which would you rather hear?", "blocks": ["COMPARE THESE TWO", "Read them both out loud. Decide which one you'd stay on the phone for — and be ready to say why.", "A", "B", "“Momence is an all-in-one platform that has appointment or class bookings, automated sequences, and two way text messaging. It's really easy to integrate with your website, comes with 24/7 support, and has complimentary onboarding. I'd love to show you how we can help you save time and grow your business!”", "“Momence is a platform that does a lot of things for studios, like scheduling and payments, and it's pretty easy to use. It's kind of like other management software but maybe better in some ways. You should try it because it could help your business. Let me know if you're interested.”", "Say them out loud before you decide. Which one gives a prospect a reason to keep listening — and what exactly makes the difference?"]}, {"number": 16, "title": "What actually separates them", "blocks": ["THE REVEAL", "A is the stronger of the two. It's still almost entirely about us.", "STRONG MESSAGING FEELS", "WEAK MESSAGING TENDS TO", "Relevant", "List features", "Clear", "Talk mostly about us", "Conversational", "Sound rehearsed", "Tied to a business outcome", "Give them no reason to care", "THE PART NOBODY PICKS", "A names six capabilities and never once mentions the prospect's business. It's the better answer here — and it would still lose to one sentence about their booking flow.", "Now rebuild A using the four parts and a real problem from pre-vetting. Same product. Half the words."]}, {"number": 17, "title": "Same Momence. Different conversation.", "blocks": ["RELEVANCE CHANGES, PRODUCT DOESN'T", "Read across each row. The product is identical in all three columns.", "PILATES STUDIO", "WELLNESS PRACTICE", "FITNESS STUDIO", "PERSONA", "Founder", "Operations Manager", "Studio Manager", "WHAT YOU\nNOTICED", "14 weekly in-person classes.\nBookings come in through DMs.", "4 bookable practitioners.\nAlready running on Mindbody.", "Plenty of first visits.\nClients stop showing after a few weeks.", "WHAT YOU'D\nLEAD WITH", "“Getting the schedule off your phone — booking runs from your own website.”", "“One place for scheduling and client messaging instead of two systems.”", "“Automated follow-up so people don't quietly disappear.”", "Swap the bottom row between the columns and all three calls fail — with the same product and the same true statements.", "Illustrative examples, built to our qualification parameters."]}, {"number": 18, "title": "So… who should you actually work?", "blocks": ["THE OPERATIONAL QUESTION", "You now know what good looks like. Next problem: there's more list than there is day.", "Your list is effectively unlimited. Your dials are not.   120 a day. Which 120?", "WITHOUT PRE-VETTING", "WITH PRE-VETTING", "You call in whatever order the list loaded.", "You call a list you already trust.", "You find out it's a gym on dial forty.", "Every account has a reason you're calling it.", "Every call starts from zero — no reason to be calling.", "Your worst call of the day is still a fit.", "And check the data. Not everything in HubSpot is accurate — vertical, software and contact fields can all be wrong. Do your due diligence and fact check against the website."]}, {"number": 19, "title": "How to pre-vet a lead", "blocks": ["THE FRAMEWORK", "Three questions, then a decision. Same order, every time.", "BUSINESS FIT", "PERSONA FIT", "CONTEXT", "Does this look like our ICP?", "Can I identify the right person?", "What changes my approach?", "Type, vertical, physical location, working website, size signal.", "A qualifying title on the website, on LinkedIn, or already on the record.", "Current software, vertical, company owner, anything on the site worth opening with.", "DECISION", "What do you do with it? Every lead leaves pre-vetting in one of these four states.", "ATTEMPTING", "NURTURE", "UNQUALIFIED", "DEAD", "Goes into your working pool — you'll be performing outreach on it.", "Qualified, but not ready for outreach — three month cooling period.", "Does not meet the demo qualification parameters.", "Fake account, bad email, or requested do-not-contact.", "These are real lead statuses. How to set them in HubSpot is covered in the reference video — today is about making the call correctly."]}, {"number": 20, "title": "Minimum viable research", "blocks": ["HOW MUCH IS ENOUGH", "The goal is not to know everything about the business. It's to know enough to make a better decision.", "Is this business worth pursuing?", "Who should I contact?", "What did I learn that changes my approach?", "Business fit. Yes or no.", "A name, or a route to one.", "One thing. That's enough.", "If more research won't change the answer to any of those three — you're done. Move on.", "WHERE THE EVIDENCE COMES FROM", "The website, as it reads in the month the demo takes place. If the class schedule or booking widget isn't public: the website or LinkedIn — a class schedule PDF, the about-us page, LinkedIn profiles for job titles."]}, {"number": 21, "title": "Live practice", "blocks": ["LET'S VET ONE TOGETHER", "Nobody answers until we've all looked. Same four steps.", "RIVERBEND PILATES  ·  AUSTIN, TX", "Website", "Class schedule page", "About-us page", "Live. Storefront on a main street.", "11 weekly in-person classes.", "Lists 3 instructors.", "LinkedIn", "HubSpot record", "A Studio Manager and a Founder.", "Current software: Mindbody.", "BUSINESS FIT", "PERSONA FIT", "CONTEXT", "DECISION", "Does this look like our ICP?", "Who do we contact, and how?", "What here should change how we open?", "What do we do with this record?", "?", "?", "?", "?", "Illustrative example. Take answers from the room before you reveal anything."]}, {"number": 22, "title": "Pre-vet now, and never stop", "blocks": ["STARTING TODAY", "You'll get leads today. From here to Day 9, every gap in the schedule is pre-vetting time.", "AVAILABLE DOWNTIME   =   PRE-VETTING TIME         Days 2 – 9", "END OF WEEK 2", "A substantial pool of vetted, callable leads", "DAY 7", "Large enough to work a full block", "DAY 4", "Growing — and reviewed in the workshop", "DAY 2", "A small vetted pool", "This isn't busy work. Day 4 isn't “what is pre-vetting” — it's where we review the work you've already done.", "Pre-vetting is part of the job — not a phase of onboarding. Failing to do it consistently leads to a dead pipeline."]}, {"number": 23, "title": "Day 2 Takeaways", "blocks": ["DAY 2 TAKEAWAY", "Know who we sell to.", "TOMORROW", "Owning Your\nTerritory", "Understand why they'd care.", "You can now spot a good prospect. Next you'll learn to handle a lot of them at once:", "Know who deserves your time.", "Your Book of Business.", "How to understand it, organize it, prioritize it, and manage it so the right accounts get your hours.", "And starting today, you're doing it on real leads."]}], "videos": [{"title": "Pre-Vetting Example 1", "src": "videos/pre-vetting-example-1.mp4"}, {"title": "Pre-Vetting Example 2", "src": "videos/prevetting-example-2.mp4"}], "source": "resources/onboarding-day-2.pptx", "slides": [{"src": "slides/day-02-slide-01.jpg", "thumb": "slides/day-02-slide-01-thumb.jpg", "title": "Who We Sell To + Why"}, {"src": "slides/day-02-slide-02.jpg", "thumb": "slides/day-02-slide-02-thumb.jpg", "title": "Who we sell to"}, {"src": "slides/day-02-slide-03.jpg", "thumb": "slides/day-02-slide-03-thumb.jpg", "title": "Understand their business before our product"}, {"src": "slides/day-02-slide-04.jpg", "thumb": "slides/day-02-slide-04-thumb.jpg", "title": "What each question tells you"}, {"src": "slides/day-02-slide-05.jpg", "thumb": "slides/day-02-slide-05-thumb.jpg", "title": "What problems are we solving?"}, {"src": "slides/day-02-slide-06.jpg", "thumb": "slides/day-02-slide-06-thumb.jpg", "title": "Three problems, over and over"}, {"src": "slides/day-02-slide-07.jpg", "thumb": "slides/day-02-slide-07-thumb.jpg", "title": "Problem → Impact → Value"}, {"src": "slides/day-02-slide-08.jpg", "thumb": "slides/day-02-slide-08-thumb.jpg", "title": "You have the problem. Find the rest."}, {"src": "slides/day-02-slide-09.jpg", "thumb": "slides/day-02-slide-09-thumb.jpg", "title": "What is our ICP?"}, {"src": "slides/day-02-slide-10.jpg", "thumb": "slides/day-02-slide-10-thumb.jpg", "title": "ICP does not mean qualified"}, {"src": "slides/day-02-slide-11.jpg", "thumb": "slides/day-02-slide-11-thumb.jpg", "title": "The right business is only half of it"}, {"src": "slides/day-02-slide-12.jpg", "thumb": "slides/day-02-slide-12-thumb.jpg", "title": "What makes a meeting qualified?"}, {"src": "slides/day-02-slide-13.jpg", "thumb": "slides/day-02-slide-13-thumb.jpg", "title": "Why would someone talk to us?"}, {"src": "slides/day-02-slide-14.jpg", "thumb": "slides/day-02-slide-14-thumb.jpg", "title": "Building a repeatable framework"}, {"src": "slides/day-02-slide-15.jpg", "thumb": "slides/day-02-slide-15-thumb.jpg", "title": "Which would you rather hear?"}, {"src": "slides/day-02-slide-16.jpg", "thumb": "slides/day-02-slide-16-thumb.jpg", "title": "What actually separates them"}, {"src": "slides/day-02-slide-17.jpg", "thumb": "slides/day-02-slide-17-thumb.jpg", "title": "Same Momence. Different conversation."}, {"src": "slides/day-02-slide-18.jpg", "thumb": "slides/day-02-slide-18-thumb.jpg", "title": "So… who should you actually work?"}, {"src": "slides/day-02-slide-19.jpg", "thumb": "slides/day-02-slide-19-thumb.jpg", "title": "How to pre-vet a lead"}, {"src": "slides/day-02-slide-20.jpg", "thumb": "slides/day-02-slide-20-thumb.jpg", "title": "Minimum viable research"}, {"src": "slides/day-02-slide-21.jpg", "thumb": "slides/day-02-slide-21-thumb.jpg", "title": "Live practice"}, {"src": "slides/day-02-slide-22.jpg", "thumb": "slides/day-02-slide-22-thumb.jpg", "title": "Pre-vet now, and never stop"}, {"src": "slides/day-02-slide-23.jpg", "thumb": "slides/day-02-slide-23-thumb.jpg", "title": "Day 2 Takeaways"}]}, {"day": 3, "title": "Owning Your Book of Business", "intro": "Organize your territory, prioritize leads, and maintain clean records.", "practice": ["Open your actual book and identify what to work today.", "Build a purposeful segment and explain the status and code choices."], "amendments": ["Nurture, Booked, and Opportunity can remain in the SDR-owned book. They leave the active cold-outreach pool, not necessarily ownership. SDR outreach stops after demo attendance; ownership leaves the SDR book at closed-won.", "A reminder-backed callback can interrupt nurture. RevOps controls distributions; a manager must assign an unowned lead before self-sourced outreach. Old replenishment instructions do not authorize self-assignment."], "sections": [{"number": 1, "title": "Owning Your Book of Business", "blocks": ["BY THE END OF TODAY\nYOU CAN ANSWER", "What is actually in my Book?", "What deserves my attention right now?", "Your BoB isn't a list you work through.\nIt's something you actively manage.", "What happens to a lead next?", "YESTERDAY", "TODAY", "How do I keep my Book healthy?", "You learned how to identify\nprospects worth pursuing.", "You learn how to organize, prioritize\nand manage the prospects you own."]}, {"number": 2, "title": "What is a Book of Business?", "blocks": ["THE DEFINITION", "A portfolio of leads that you own and continuously manage.", "Nothing enters or leaves it without your decision. You choose what gets worked, what gets parked, and what gets replaced.", "You decide what gets worked today", "You keep the records accurate", "Request manager-assigned replenishment when needed", "Nobody assigns you a call list. You choose.", "Your Book is only as good as what's in it.", "Leads exit every week. You bring more in.", "THE MEASURE OF SUCCESS", "Success is determined by how well you manage your Book — not by how many new leads you receive."]}, {"number": 3, "title": "This one is yours to run", "blocks": ["THE MINDSET", "Most people expect a list every morning. You get something better — and one question drives it.", "WHAT MOST PEOPLE EXPECT", "WHAT YOU ACTUALLY HAVE", "A Book of your own, and one question:\n“What deserves my attention right now?”", "A list handed to you each morning.", "AND MANAGING IT IS A LOOP, NOT A TASK", "UNDERSTAND", "PRIORITIZE", "ACT", "MAINTAIN", "What's in my Book, and why is it here?", "What deserves attention today?", "Work it, and log what happened.", "Replace what left. Keep it clean.", "↻   and back to the top"]}, {"number": 4, "title": "Understand before you act", "blocks": ["STEP ONE — UNDERSTAND", "Random prospecting is what happens when a rep starts dialing before reading their own Book.", "What is in my Book?", "Why is this lead here?", "What has already happened?", "Every lead you own sits in exactly one of nine statuses.", "Vertical, software, source — something put it in front of you.", "Calls, emails, connects, a conversation someone had before you.", "The point", "What does the status tell me?", "What needs attention?", "Five minutes of reading your Book saves an hour of calling the wrong half of it.", "The status is a summary of everything above, in one word.", "Only now do you decide where the day goes.", "Every lead you own sits in exactly one status. Nine buckets describe your entire Book — learn them and you can read it at a glance."]}, {"number": 5, "title": "The four statuses you actively work", "blocks": ["STATUS = NEXT ACTION  ·  1 OF 2", "Don't memorize definitions. Learn what each one is telling you to do.", "NEW", "ATTEMPTING", "RECYCLED", "NURTURE", "WHY THEY'RE HERE", "WHY THEY'RE HERE", "WHY THEY'RE HERE", "WHY THEY'RE HERE", "New to the CRM, or never called or emailed.", "Has a last contacted date. Outreach is in progress.", "Completed a three-month nurture and can be outreached again.", "Qualified, but not ready for outreach. Three-month cooling period.", "WHAT IT TELLS YOU", "WHAT IT TELLS YOU", "WHAT IT TELLS YOU", "WHAT IT TELLS YOU", "Nobody has touched this. The entire opportunity is still in front of you.", "You've started. A 30-day clock is now running on this account.", "They've heard from us before — and the timing has changed since then.", "The answer was “not now,” not “no.” The clock is doing the work.", "WHAT HAPPENS NEXT", "WHAT HAPPENS NEXT", "WHAT HAPPENS NEXT", "WHAT HAPPENS NEXT", "Pre-vet it, then dial it. This is where your Book grows.", "Keep the outreach alive. 30 days of silence moves it to Nurture.", "Work it like a fresh lead, with the history in hand.", "Leave it alone until the cooling period ends — then it becomes Recycled.", "The colored block is the only row that matters on a Monday morning."]}, {"number": 6, "title": "Where every lead ends up", "blocks": ["STATUS = NEXT ACTION  ·  2 OF 2", "Leads move forward, loop back, or exit. Nothing sits still.", "FORWARD PATH", "SDR owns the first two.\nThe AE owns the rest.", "New / Recycled", "Attempting", "Booked", "Opportunity", "Customer", "RETURN PATH", "30 days quiet", "3 months", "Attempting", "Nurture", "Recycled", "A “no” isn't an exit — it's a timer.", "EXITS", "Unqualified", "fails demo parameters", "Dead", "bad data or DNC", "You rarely set these by hand. Log the disposition and the status updates itself — Not Interested sends it to Nurture, Meeting Set sends it to Booked. Two rules act on the contact, not the company."]}, {"number": 7, "title": "Why we code", "blocks": ["THE CODING SYSTEM", "Status tells you where a lead is. A code tells you what you know about it.", "Status is shared", "Codes are yours", "Codes are filterable", "Everyone's Attempting means the same thing. It's the process, not your judgment.", "What you learned on the call. How warm it felt. Whether it's ready to dial.", "Written in SDR Additional Notes so HubSpot can pull them into a list.", "THE POINT OF A CODE", "A code turns something only you remember into something you can filter on tomorrow.", "Consistent beats clever. A code you apply on every account is worth more than a perfect system you use twice."]}, {"number": 8, "title": "Choosing the right code", "blocks": ["APPLICATION", "Four codes. The skill is picking the right one without thinking about it.", "AF1", "Pre-vetted & ready to dial\ngreat ICP fit", "AF2", "Pre-vetted & ready to dial\nokay ICP fit", "AFH", "Hot leads", "AFU", "Unqualified leads", "THE SITUATION", "THE SITUATION", "THE SITUATION", "THE SITUATION", "A pilates studio running 14 weekly in-person classes. Founder named on LinkedIn, working website, storefront.", "A dance studio with 9 weekly classes and a Studio Manager listed. Everything else checks out.", "You connected last week. The owner asked you to call her back Thursday — she's actively shopping.", "A gym with 4 bookable staff, no class schedule, running on ClubReady.", "WHAT WE KNOW", "WHAT WE KNOW", "WHAT WE KNOW", "WHAT WE KNOW", "New  ·  Priority 1 vertical  ·  clears every parameter", "New  ·  Priority 2 vertical  ·  qualifies, lower priority", "Attempting  ·  a named callback  ·  in-market", "Non-ICP vertical  ·  do-not-book software", "AF1", "Research done, strong fit. Straight into a dialing list.", "AF2", "Worth dialing — just behind your Priority 1 accounts.", "AFH", "She gave you the timing. Top of tomorrow's list.", "AFU", "Fails demo parameters. Clear it out of your pool.", "AF1 and AF2 are the two you'll apply most — every account you finish pre-vetting gets one or the other."]}, {"number": 9, "title": "Not every lead deserves attention today", "blocks": ["STEP TWO — PRIORITIZE", "Owning a large Book does not mean treating every lead in it equally.", "WORK NOW", "WAIT", "Book Maintenance", "DONE", "New", "Nurture", "Booked", "Unqualified", "Recycled", "Opportunity", "Dead", "Attempting", "Customer", "Live in your working pool. This is where your dials go.", "In a three-month cooling period. Pause routine outreach; a planned callback with a task or reminder can interrupt nurture.", "Booked: the SDR coordinates until attendance. After attendance, the AE owns communication; the account stays in the SDR book until closed-won.", "Out of your pool. Don't re-work them — clear them out.", "Owning two thousand leads doesn't mean two thousand leads deserve a dial. Your statuses already tell you which ones do.", "How a Book stalls: ignoring New and Recycled, and working one list over and over instead of rotating through the whole Book."]}, {"number": 10, "title": "Who do I work first?", "blocks": ["TOMORROW MORNING", "There's no scoring system. There's an order — run it every day, in this order.", "Open your Book", "Choose your focus", "Review Attempting", "Execute", "Call first  OR  pre-vet first", "OR New / Recycled", "Update the CRM", "Complete the half you skipped", "Back to the top of your Book", "Disposition everything, same day", "Step 03 is where reps go wrong. Reviewing Attempting feels productive because those accounts already have history — but a Book that never touches New or Recycled stops growing."]}, {"number": 11, "title": "Needs attention now vs. worked later", "blocks": ["TIMING", "Good Book management isn't calling everyone repeatedly. It's knowing where a lead belongs.", "NEEDS ATTENTION NOW", "SHOULD BE WORKED LATER", "New   ·   Recycled   ·   Attempting", "Nurture", "These are your active workflow. They belong in today's lists, today's dials and today's dispositions.", "Qualified, but not ready. A three-month cooling period is running. Use a task or reminder for a prospect-requested callback; otherwise respect the cool-off period.", "AND IT COMES BACK", "30 days quiet", "3 months later", "Attempting", "Nurture", "Recycled", "Back in your\nworking pool.", "A “not interested” isn't an exit — it's a timer. Log it honestly, let the cooling period run, and it comes back to you as a Recycled lead with a reason to call."]}, {"number": 12, "title": "Why we segment", "blocks": ["STEP THREE — SEGMENT", "“I have thousands of leads.”", "Which of them am I working today?", "A segment answers the only question that matters this morning.", "A useful list is a group of prospects that need the same action for the same reason.", "ACTIVE LIST", "STATIC LIST", "MEMBERSHIP", "Updates itself as records meet or stop meeting the criteria", "MEMBERSHIP", "Fixed at the moment you create it", "EDIT BY HAND", "No — the criteria decide who is in", "EDIT BY HAND", "Yes — you add and remove records", "USE IT FOR", "Standing views you return to daily: New, Recycled, Attempting", "USE IT FOR", "A batch you intend to finish: today's call list", "WATCH OUT", "Leads drop off as their status changes — that's intended", "WATCH OUT", "It goes stale. Use them short-term, not long-term", "Segmentation is a work strategy, not a HubSpot feature. Building the list is covered in the reference video."]}, {"number": 13, "title": "From Book of Business to a list you can finish", "blocks": ["THE FUNNEL", "Decide the job first, then pull the filters that do it.", "BOOK OF BUSINESS", "PRIORITY", "SEGMENT", "ACTION", "Everything you own", "Which statuses are live", "Add code, software, vertical", "A list you can finish today", "WORKED EXAMPLE  ·  BUILD TODAY'S CALL LIST", "Everything you own   →   Attempting / New / Recycled   →   + AF1 and their current software   →   Dial and disposition the same day", "FOUR JOBS A LIST CAN DO", "JOB 01", "JOB 02", "JOB 03", "JOB 04", "Find low-hanging fruit", "Build a pre-vetting list", "Identify Unqualified accounts", "Build today's call list", "Recycled / Attempting · Vertical · Past connects · Software", "New / Recycled · Vertical · Software · Google reviews", "All statuses except Unqualified, Dead, Customer, Booked, Opportunity · Non-ICP vertical or software", "Attempting / New / Recycled · Your code, software or last activity", "Every list should have a purpose."]}, {"number": 14, "title": "Maintain Your Book", "blocks": ["STEP FOUR — MAINTAIN", "A Book is never finished", "Leads leave every week. Bring the same number back in.", "Book Maintenance", "WHAT COMES IN", "Leads that moved to Nurture — outside active cold outreach; ownership is retained.", "Leads marked Unqualified", "Manager-assigned replenishment based on available leads and team needs.", "Booked opportunities — outside active cold outreach; ownership is retained.", "Dead records", "Enough to replace everything that left and keep the pipeline healthy.", "RevOps controls distribution. Ask your manager to assign unowned leads before outreach.", "THREE WAYS A BOOK STALLS", "Ignoring New and Recycled", "Forgetting to replenish", "Working one list instead of rotating"]}, {"number": 15, "title": "What would you work first?", "blocks": ["LIVE PRACTICE", "Five accounts from one Book. Nobody answers until we've read all five.", "A", "B", "C", "D", "E", "ATTEMPTING", "NEW", "NURTURE", "ATTEMPTING", "RECYCLED", "AFH", "AF1", "AF2", "Said not interested 5 weeks ago. Cooling period ends in 7 weeks.", "Last contacted 27 days ago. Three no-answers, nothing since.", "Connected 6 days ago. Owner asked you to call her back this week.", "Pre-vetted yesterday. Pilates studio, 11 weekly classes, Founder identified. Never dialed.", "Three-month nurture complete, back in play. Previously said they'd just renewed.", "Who do you work first — and what do you do with the other four?", "Who's first?", "Why that one?", "What about the others?"]}, {"number": 16, "title": "Day 3 Takeaways", "blocks": ["DAY 3 TAKEAWAY", "Know what's in your Book.", "TOMORROW", "Pre-Vetting\nWorkshop", "Know what deserves attention.", "You've been pre-vetting since Day 2. Tomorrow isn't an introduction — it's a review of the work you've already done, and we make those decisions:", "Know what happens next.", "Faster.", "More accurate.", "Pre-vetting continues today. Every gap in the schedule is still pre-vetting time.", "More consistent.", "Bring your edge cases and the ones you weren't sure about."]}], "videos": [{"title": "Changing Lead Status", "src": "videos/changing-leadstatus.mp4"}, {"title": "Cloning Lists", "src": "videos/cloning-lists.mp4"}, {"title": "Organizing Your HubSpot Fields", "src": "videos/organizing-your-hubspot-fields.mp4"}, {"title": "SDR Additional Notes And Codes", "src": "videos/sdr-additional-notes-and-codes.mp4"}, {"title": "Viewing Your Leads", "src": "videos/viewing-your-leads.mp4"}, {"title": "Advanced Lists", "src": "videos/advanced-lists.mp4"}, {"title": "Creating Lists", "src": "videos/creating-lists.mp4"}], "source": "resources/onboarding-day-3.pptx", "slides": [{"src": "slides/day-03-slide-01.jpg", "thumb": "slides/day-03-slide-01-thumb.jpg", "title": "Owning Your Book of Business"}, {"src": "slides/day-03-slide-02.jpg", "thumb": "slides/day-03-slide-02-thumb.jpg", "title": "What is a Book of Business?"}, {"src": "slides/day-03-slide-03.jpg", "thumb": "slides/day-03-slide-03-thumb.jpg", "title": "This one is yours to run"}, {"src": "slides/day-03-slide-04.jpg", "thumb": "slides/day-03-slide-04-thumb.jpg", "title": "Understand before you act"}, {"src": "slides/day-03-slide-05.jpg", "thumb": "slides/day-03-slide-05-thumb.jpg", "title": "The four statuses you actively work"}, {"src": "slides/day-03-slide-06.jpg", "thumb": "slides/day-03-slide-06-thumb.jpg", "title": "Where every lead ends up"}, {"src": "slides/day-03-slide-07.jpg", "thumb": "slides/day-03-slide-07-thumb.jpg", "title": "Why we code"}, {"src": "slides/day-03-slide-08.jpg", "thumb": "slides/day-03-slide-08-thumb.jpg", "title": "Choosing the right code"}, {"src": "slides/day-03-slide-09.jpg", "thumb": "slides/day-03-slide-09-thumb.jpg", "title": "Not every lead deserves attention today"}, {"src": "slides/day-03-slide-10.jpg", "thumb": "slides/day-03-slide-10-thumb.jpg", "title": "Who do I work first?"}, {"src": "slides/day-03-slide-11.jpg", "thumb": "slides/day-03-slide-11-thumb.jpg", "title": "Needs attention now vs. worked later"}, {"src": "slides/day-03-slide-12.jpg", "thumb": "slides/day-03-slide-12-thumb.jpg", "title": "Why we segment"}, {"src": "slides/day-03-slide-13.jpg", "thumb": "slides/day-03-slide-13-thumb.jpg", "title": "From Book of Business to a list you can finish"}, {"src": "slides/day-03-slide-14.jpg", "thumb": "slides/day-03-slide-14-thumb.jpg", "title": "Maintain Your Book"}, {"src": "slides/day-03-slide-15.jpg", "thumb": "slides/day-03-slide-15-thumb.jpg", "title": "What would you work first?"}, {"src": "slides/day-03-slide-16.jpg", "thumb": "slides/day-03-slide-16-thumb.jpg", "title": "Day 3 Takeaways"}]}, {"day": 4, "title": "Pre-Vetting Workshop", "intro": "Apply pre-vetting to real accounts and resolve uncertain cases.", "practice": ["Bring real accounts and uncertain cases.", "Review qualification evidence and write usable SDR Additional Notes."], "amendments": ["Use current qualification exceptions, including the Mariana Tek policy. Escalate unresolved qualification edge cases rather than inventing a rule."], "sections": [{"number": 1, "title": "Pre-Vetting Workshop", "blocks": ["THIS IS A WORKSHOP", "You've been pre-vetting since Day 2. Today we look at your actual work.", "Bring the accounts you weren't sure about — the ones where you couldn't find the right person, or couldn't tell if they were a fit, or spent twenty minutes and still didn't decide.", "You already know the framework.\nToday we get better at using it.", "Those are the slides today.", "FASTER", "MORE ACCURATE", "MORE CONSISTENT"]}, {"number": 2, "title": "The framework you've been using", "blocks": ["RECAP  ·  FROM DAY 2", "Three questions, then a decision. Nothing here is new — it's the mental model for today.", "BUSINESS FIT", "PERSONA FIT", "CONTEXT", "DECISION", "Does this look like our ICP?", "Can I identify the right person?", "What changes my approach?", "What do I do with this record?", "AND WHAT THAT LOOKS LIKE IN PRACTICE", "Identify if the company falls within ICP", "Decide who you want to reach out to", "Find the mobile number and personal email", "Conduct additional research", "Update SDR Additional Notes with your code and everything you found", "Add to a list or a sequence", "Step 5 is the last act of pre-vetting. Your code plus everything you found, in SDR Additional Notes — that's what makes the work reusable."]}, {"number": 3, "title": "What have you run into so far?", "blocks": ["OPEN DISCUSSION", "Two days of real pre-vetting. Before we teach anything, let's hear where it's actually been hard.", "What's been easy?", "What's been confusing?", "The parts that already feel automatic.", "Where you weren't sure what the right call was.", "Where is the time going?", "What made you unsure?", "The step that eats the most of your session.", "The accounts you left without deciding.", "No wrong answers. The friction you name here is what we spend the rest of the session on."]}, {"number": 4, "title": "What good pre-vetting looks like", "blocks": ["THE STANDARD", "You're not trying to know everything about a business. You're trying to make four decisions.", "ARE THEY WORTH CALLING?", "WHO DO I CALL?", "WHAT SHOULD I KNOW?", "HOW DO I APPROACH THEM?", "Are they a good fit for Momence?", "Who are the decision makers?", "Have there been past conversations?", "Do they answer? Have they responded to emails? Is there something to personalize?", "AND THE LAST STEP, EVERY TIME", "Update SDR Additional Notes with your code and everything you found — so it pops up in Orum while you're dialing, instead of living in your head.", "Pre-vetting is decision-making. It is not research for the sake of research."]}, {"number": 5, "title": "Accuracy vs. speed", "blocks": ["THE BALANCE", "Both failure modes cost you meetings. One is just easier to see than the other.", "ENOUGH", "TOO LITTLE", "TOO MUCH", "Confident decisions, quickly.", "Weak decisions and missed context.", "Wasted prospecting time.", "You know whether to pursue them, who to reach, and one thing worth mentioning. Then you move.", "You dial a business you don't understand, reach the wrong person, and have nothing to open with.", "Twenty minutes on one account you were always going to call, while the rest of the list sits there.", "“Do it right, or do it again.” The more effort you put in up front, the less work you have to do down the line.", "There is no clock on this. We're not trying to make you rush — we're trying to make the decision obvious sooner."]}, {"number": 6, "title": "Where this usually gets sticky", "blocks": ["COACHING", "Five things that slow good reps down — and what our own playbook says about each.", "Researching the same account twice", "If it isn't in the note, you will look it up again. Write it down while you have it — it surfaces in Orum when you dial.", "Trusting what's already on the record", "“If you didn't put it there — check it.” Inherited data is a starting point, not a fact.", "Filtering too hard", "Spend most of your time on good leads, but don't sleep on the fringe fits.", "Writing off a past rejection", "Just because they've rejected you — or someone else — once, doesn't mean you give up on them.", "Researching things that change nothing", "If it doesn't change whether you pursue them, who you call, or how you open — you didn't need it.", "None of these are about effort. They're all about aim."]}, {"number": 7, "title": "Research that actually matters", "blocks": ["THE FILTER", "“What does this change about how I approach them?”", "WHAT DID I LEARN?", "DOES IT CHANGE MY DECISION\nOR MY APPROACH?", "YES", "NO", "Use it — and put it in the note, with your code, so you still have it on the call.", "Then ask honestly whether you needed to go looking for it."]}, {"number": 8, "title": "Pull up your own leads", "blocks": ["WORKING SESSION", "The rest of this session runs on your accounts, not made-up ones.", "Open the leads you've pre-vetted since Day 2. Find the ones that gave you trouble.", "BRING AN ACCOUNT WHERE YOU…", "Weren't sure about fit", "Couldn't identify the right person", "Found conflicting information", "We'll work them on screen, together.", "Weren't sure what decision to make", "Spent too much time and still didn't decide", "There are no points for having had an easy week. The messy accounts are the useful ones."]}, {"number": 9, "title": "Good pre-vetting is…", "blocks": ["DAY 4 TAKEAWAY", "ACCURATE", "EFFICIENT", "CONSISTENT", "The decision holds up when you get them on the phone.", "You get there without burning the morning on one account.", "The next hundred look like the last hundred.", "The goal isn't to know everything.", "It's to know enough to make the right next decision.", "If you can answer the four questions and the note has your code plus what matters — you're done. Move to the next one."]}, {"number": 10, "title": "Keep building your callable pool", "blocks": ["BEFORE YOU GO", "TOMORROW", "Cold Calling\nFundamentals", "Today's workshop doesn't end the assignment. Available downtime through Day 9 is still pre-vetting time.", "Days 2, 3 and 4 were about deciding who deserves a call and what you'd say to them.", "Tomorrow we turn all of it into conversations.", "You go live on Day 10. Everything you vet between now and then is a prospect you can call with confidence on your first real day.", "Come with a list you'd actually be willing to dial."]}], "videos": [{"title": "Pre-Vetting Example 1", "src": "videos/pre-vetting-example-1.mp4"}, {"title": "Pre-Vetting Example 2", "src": "videos/prevetting-example-2.mp4"}, {"title": "Pre-Vetting Example 3", "src": "videos/prevetting-example-3.mp4"}, {"title": "Signal Hire And True People Search", "src": "videos/signal-hire-and-true-people-search.mp4"}, {"title": "Pre-Vetting Example 4", "src": "videos/prevetting-example-4.mp4"}], "source": "resources/onboarding-day-4.pptx", "slides": [{"src": "slides/day-04-slide-01.jpg", "thumb": "slides/day-04-slide-01-thumb.jpg", "title": "Pre-Vetting Workshop"}, {"src": "slides/day-04-slide-02.jpg", "thumb": "slides/day-04-slide-02-thumb.jpg", "title": "The framework you've been using"}, {"src": "slides/day-04-slide-03.jpg", "thumb": "slides/day-04-slide-03-thumb.jpg", "title": "What have you run into so far?"}, {"src": "slides/day-04-slide-04.jpg", "thumb": "slides/day-04-slide-04-thumb.jpg", "title": "What good pre-vetting looks like"}, {"src": "slides/day-04-slide-05.jpg", "thumb": "slides/day-04-slide-05-thumb.jpg", "title": "Accuracy vs. speed"}, {"src": "slides/day-04-slide-06.jpg", "thumb": "slides/day-04-slide-06-thumb.jpg", "title": "Where this usually gets sticky"}, {"src": "slides/day-04-slide-07.jpg", "thumb": "slides/day-04-slide-07-thumb.jpg", "title": "Research that actually matters"}, {"src": "slides/day-04-slide-08.jpg", "thumb": "slides/day-04-slide-08-thumb.jpg", "title": "Pull up your own leads"}, {"src": "slides/day-04-slide-09.jpg", "thumb": "slides/day-04-slide-09-thumb.jpg", "title": "Good pre-vetting is…"}, {"src": "slides/day-04-slide-10.jpg", "thumb": "slides/day-04-slide-10-thumb.jpg", "title": "Keep building your callable pool"}]}, {"day": 5, "title": "Cold Calling Fundamentals", "intro": "Open a conversation, discover a problem, and earn the meeting.", "practice": ["Practice the opening, discovery, relevant value, and meeting ask."], "amendments": [], "sections": [{"number": 1, "title": "Cold Calling Fundamentals", "blocks": ["THE ONE IDEA", "You're not selling Momence.\n\nYou're selling the meeting.", "You know who to call.", "You know why they might care.", "Relax — you're a consultant. This is the discovery phase, and your job is to earn the next conversation.", "You've researched the business.", "So how do you turn that into a conversation?"]}, {"number": 2, "title": "What a cold call is actually for", "blocks": ["THE GOAL", "Not to explain Momence. To earn the next conversation.", "NOT THIS", "THIS", "Explain everything   →   Sell Momence", "Create relevance   →   Start a conversation   →   Earn the next step", "Nobody buys software from a cold call. They agree to a conversation.", "That's the whole job on this call. Everything else belongs to the AE.", "ENOUGH OF THREE THINGS TO EARN FIFTEEN MINUTES", "RELEVANCE", "INTEREST", "CURIOSITY", "It sounds like their business, not a script.", "Something you said is worth their attention.", "They want to know more than you told them.", "“You're not selling Momence — you're selling a meeting.”"]}, {"number": 3, "title": "The anatomy of a great cold call", "blocks": ["THE FRAMEWORK", "Six moments. Each one is trying to accomplish something different.", "OPEN", "EARN ATTENTION", "CREATE RELEVANCE", "DISCOVER", "CONNECT VALUE", "ASK FOR THE MEETING", "Get a human on the line", "Give them a reason to stay", "Sound like their business", "Find what isn't working", "One relevant thing", "Go for it", "THIS IS THE SAME CALL OUR TRAINING HAS ALWAYS DESCRIBED", "Intro", "1 – 3", "Discovery & questions", "Go for the meeting", "5 – 6", "Close the meeting", "—", "Make this your own. How are you going to engage them?", "Find pain points.", "You have some ammo — time to shoot your shot.", "Confirm the time and set the next step. (Day 8)", "Stages 2 and 3 aren't new — they're the part of “Intro” that decides whether you get to the rest of the call."]}, {"number": 4, "title": "The first ten seconds", "blocks": ["OPEN  ·  EARN ATTENTION", "You don't need the perfect sentence. You need four things to be true.", "SOUND HUMAN", "BE CLEAR", "EARN ATTENTION", "GET PERMISSION", "Not a recording, not a script.", "They know who you are and why you called.", "Give them a reason not to hang up.", "A moment of consent to keep going.", "TWO TYPES OF OPENER — PICK ONE FOR THE PERSON WHO PICKED UP", "PERMISSION-BASED", "FRIENDLY", "For someone who's already annoyed you called.", "For someone who sounds open to talking.", "Get to the point, fast.", "Build rapport, match their energy.", "Transition into the ask for the meeting.", "Ask questions.", "Don't waste time on a pile of questions.", "Then get back to why you called.", "One example, not the script:  “Hi, I was hoping to speak with you or the person who handles your scheduling software.”   Make it your own."]}, {"number": 5, "title": "Getting past the gatekeeper", "blocks": ["NAVIGATION", "Their job is to keep you away from the decision maker. Yours is to get there anyway.", "WHAT'S THEIR JOB?", "HOW DO YOU APPROACH?", "HOW MUCH DO YOU SHARE?", "Keeping you away from the decision maker. It isn't personal — it's the role.", "Match their tone. Share the bare minimum. Be someone they don't mind putting through.", "Answer their questions. Don't overshare and don't pitch them.", "WATCH FOR THIS", "Some decision makers pretend to be gatekeepers. You'll know by how much they know and how much they're willing to share.", "The goal is a name and a route to them — not a pitch delivered to the person who answered the phone."]}, {"number": 6, "title": "Where your pre-vetting shows up", "blocks": ["CREATE RELEVANCE", "Everything you found on Day 4 exists for this moment.", "WHAT I KNOW", "WHAT MIGHT MATTER", "WHY I'M CALLING", "From your research and the note.", "What a business like this usually cares about.", "Said out loud, in one sentence.", "ONE EXAMPLE  ·  A PILATES STUDIO YOU PRE-VETTED LAST WEEK", "WHAT I KNOW", "WHAT MIGHT MATTER", "WHY I'M CALLING", "14 weekly classes, one location, currently on Mindbody. It's in your note.", "Studios this size usually care about filling classes, cutting no-shows and keeping clients.", "“I work with a lot of pilates studios on filling classes and cutting no-shows — is that something you think about?”", "Research only becomes valuable when it changes the conversation. If what you found doesn't show up in the first thirty seconds, it didn't do anything for you."]}, {"number": 7, "title": "Discovery, not interrogation", "blocks": ["DISCOVER", "You're a consultant having a conversation — not a form being filled in.", "What's happening?", "What might matter?", "Is there something here?", "How the business actually runs today.", "What they don't like about how it runs.", "Whether any of it is worth exploring further.", "THREE QUESTIONS THAT DO A LOT OF WORK", "“What are two things you love about…?”", "“If you could change anything about it…?”", "“How's your experience been with…?”", "Three good questions beat fifteen. You're looking for what they don't like about how things work today — that's the opening you need."]}, {"number": 8, "title": "Listen for the thread", "blocks": ["THE SKILL THAT SEPARATES REPS", "They will hand you something. The only question is whether you notice.", "THEY SAY SOMETHING", "YOU NOTICE THE SIGNAL", "YOU EXPLORE IT", "YOU LEARN MORE", "WHAT THAT SOUNDS LIKE", "“Honestly the scheduling is fine — it's the no-shows that kill us.”", "That's the thread. Not scheduling — no-shows.", "“How many are you seeing in a week? What do you do about them now?”", "Most reps hear the answer and go to their next planned question. The answer was the next question."]}, {"number": 9, "title": "Connect the problem to value", "blocks": ["CONNECT VALUE", "One relevant thing. Not the list.", "WHAT THEY SAID", "WHY IT MATTERS", "RELEVANT MOMENCE VALUE", "“The no-shows kill us.”", "Every empty spot is revenue they already lost.", "Reminders and retention tools — the thing that keeps clients coming back.", "THE THREE THINGS THEY CARE ABOUT", "Reduce operational headaches", "Boost client retention", "Maximise revenue", "scheduling, payments, client management", "reminders, loyalty programs, marketing tools", "class and event bookings, memberships, upselling", "Adding value usually isn't a product drop — it's hearing their pain, saying one thing about how we help, and moving to the meeting."]}, {"number": 10, "title": "Pitch in the conversation, not at them", "blocks": ["THE PITCH", "There is no universal pitch. There's what this person just told you.", "RECITING", "RESPONDING", "The same words on every call.", "Built from what they just said.", "Mostly about Momence.", "One capability, not the catalogue.", "You're waiting for your turn to speak.", "Ends by handing it back to them.", "“Momence is an all-in-one platform with class bookings, automated sequences, two-way texting, website integration, 24/7 support…”", "“You said no-shows are the thing. That's usually where we help most — worth showing you what that looks like?”", "WHAT YOU ADAPT TO", "The business", "The person", "What you learned before the call", "What you're hearing during it", "Same product. Different sentence, every single time."]}, {"number": 11, "title": "When you've earned the ask", "blocks": ["TIMING", "You have some ammo. Time to shoot your shot.", "WHAT YOU NEED", "WHAT YOU DON'T NEED", "They told you something that isn't working.", "They don't need to be sold.", "They engaged with a question instead of deflecting.", "They don't need to agree we're better.", "One relevant reason for a second conversation.", "They don't need to know the price.", "That's it. That's the bar.", "None of that is your job on this call.", "“It sounds like there's an opportunity for you to explore Momence a bit further.”", "Don't oversell the cold call. The moment there's a legitimate reason for another conversation — go. Talking past it costs you the meeting."]}, {"number": 12, "title": "Direct. Confident. Simple.", "blocks": ["ASK FOR THE MEETING", "The meeting is the next logical step — not a big commitment.", "CONFIDENT", "ASSUMPTIVE", "SPECIFIC", "BAD", "GOOD", "“Do you maybe want to set some time aside? How does your schedule look?”", "“Let's set aside time on Thursday at 10. Does that work for you?”", "Don't make them choose from a thousand options. Make it as easy as possible to say yes.", "Confirming the time, calendar acceptance, the handoff and show rate are Day 8. Today ends at “yes.”"]}, {"number": 13, "title": "The full call flow", "blocks": ["PUTTING IT TOGETHER", "A framework, not a script. It tells you where you are and what you're trying to do next.", "OPEN", "EARN ATTENTION", "CREATE RELEVANCE", "DISCOVER", "CONNECT VALUE", "ASK FOR THE MEETING", "Get a human on the line.", "Give them a reason to stay.", "Sound like their business.", "Find what isn't working.", "One relevant thing.", "Go for it.", "IT WON'T BE LINEAR", "WHAT IT'S FOR", "You'll loop back. You'll skip stages. Some calls end at stage two and that's a real outcome.", "Knowing which stage you're in — so you know what you're trying to accomplish next.", "Never leave a conversation without something. A meeting, a name, a callback time — but not nothing."]}, {"number": 14, "title": "Call breakdown", "blocks": ["LIVE ACTIVITY", "We'll play a real Momence cold call. Listen for the framework in a conversation that wasn't planned around it.", "Where did they earn attention?", "How did they create relevance?", "What discovery actually happened?", "What thread did they follow?", "How did they connect value?", "When did they ask for the meeting?", "What worked?", "What would you change?", "Nobody gets it all right on a real call. That's the point of listening to one."]}, {"number": 15, "title": "Role play", "blocks": ["PRACTICE", "Build the skills separately before you try to run the whole conversation.", "ROUND 1", "ROUND 2", "ROUND 3", "Opening + creating relevance", "Discovery + following the thread", "Connecting value + asking", "Get through the first thirty seconds and give them a reason to stay.", "Ask, listen, and chase what they actually said.", "One relevant thing, then go for the meeting.", "THEN", "The full cold call, start to finish — on a real account from your own Book.", "Objections will come up. Handle them however feels natural today — the actual framework for them is tomorrow."]}, {"number": 16, "title": "Three things to leave with", "blocks": ["DAY 5 TAKEAWAY", "CREATE RELEVANCE.", "STAY CURIOUS.", "EARN THE MEETING.", "Sound like their business in the first thirty seconds.", "The best question is usually about what they just said.", "Then ask for it directly, and stop selling.", "Great cold calling isn't memorizing the perfect script.", "It's understanding the conversation well enough to know what should happen next.", "And remember: you're not selling Momence. You're selling the meeting."]}, {"number": 17, "title": "Controlling the Conversation", "blocks": ["TOMORROW", "THE FRAMEWORK", "ACKNOWLEDGE", "DISARM", "Today was the call going well. Tomorrow is what happens when it doesn't.", "ADD VALUE", "Brush-offs", "Objections", "ASK", "Resistance", "That's the whole preview. We teach it tomorrow.", "Redirecting the conversation", "Knowing when to keep going — and when to walk away"]}], "videos": [], "source": "resources/onboarding-day-5.pptx", "slides": [{"src": "slides/day-05-slide-01.jpg", "thumb": "slides/day-05-slide-01-thumb.jpg", "title": "Cold Calling Fundamentals"}, {"src": "slides/day-05-slide-02.jpg", "thumb": "slides/day-05-slide-02-thumb.jpg", "title": "What a cold call is actually for"}, {"src": "slides/day-05-slide-03.jpg", "thumb": "slides/day-05-slide-03-thumb.jpg", "title": "The anatomy of a great cold call"}, {"src": "slides/day-05-slide-04.jpg", "thumb": "slides/day-05-slide-04-thumb.jpg", "title": "The first ten seconds"}, {"src": "slides/day-05-slide-05.jpg", "thumb": "slides/day-05-slide-05-thumb.jpg", "title": "Getting past the gatekeeper"}, {"src": "slides/day-05-slide-06.jpg", "thumb": "slides/day-05-slide-06-thumb.jpg", "title": "Where your pre-vetting shows up"}, {"src": "slides/day-05-slide-07.jpg", "thumb": "slides/day-05-slide-07-thumb.jpg", "title": "Discovery, not interrogation"}, {"src": "slides/day-05-slide-08.jpg", "thumb": "slides/day-05-slide-08-thumb.jpg", "title": "Listen for the thread"}, {"src": "slides/day-05-slide-09.jpg", "thumb": "slides/day-05-slide-09-thumb.jpg", "title": "Connect the problem to value"}, {"src": "slides/day-05-slide-10.jpg", "thumb": "slides/day-05-slide-10-thumb.jpg", "title": "Pitch in the conversation, not at them"}, {"src": "slides/day-05-slide-11.jpg", "thumb": "slides/day-05-slide-11-thumb.jpg", "title": "When you've earned the ask"}, {"src": "slides/day-05-slide-12.jpg", "thumb": "slides/day-05-slide-12-thumb.jpg", "title": "Direct. Confident. Simple."}, {"src": "slides/day-05-slide-13.jpg", "thumb": "slides/day-05-slide-13-thumb.jpg", "title": "The full call flow"}, {"src": "slides/day-05-slide-14.jpg", "thumb": "slides/day-05-slide-14-thumb.jpg", "title": "Call breakdown"}, {"src": "slides/day-05-slide-15.jpg", "thumb": "slides/day-05-slide-15-thumb.jpg", "title": "Role play"}, {"src": "slides/day-05-slide-16.jpg", "thumb": "slides/day-05-slide-16-thumb.jpg", "title": "Three things to leave with"}, {"src": "slides/day-05-slide-17.jpg", "thumb": "slides/day-05-slide-17-thumb.jpg", "title": "Controlling the Conversation"}]}, {"day": 6, "title": "Controlling the Conversation", "intro": "Handle resistance with acknowledge, disarm, add value, and ask.", "practice": ["Role-play objections using the four-step framework."], "amendments": [], "sections": [{"number": 1, "title": "Controlling the Conversation", "blocks": ["THE FRAMEWORK", "ACKNOWLEDGE", "DISARM", "ADD VALUE", "YESTERDAY", "TODAY", "How to structure\nthe conversation.", "What to do when it\ngets harder.", "ASK", "You don't control the conversation by talking more.", "Resistance doesn't mean the conversation is over."]}, {"number": 2, "title": "Why prospects push back", "blocks": ["NORMALIZE IT", "A cold call is an interruption. The first thing out of their mouth is usually a reflex, not a decision.", "THINK ABOUT HOME DEPOT", "Someone asks if you need help finding anything. You say “no thanks, just looking” — before you've even thought about it. Half the time you did need help.", "Our prospects feel the same way. The first “no” is a script, not an answer.", "SO WHAT ARE YOU ACTUALLY HEARING?", "A reflex", "A real concern", "A signal to stop", "They'd have said it to anyone who called.", "Something they'd genuinely need answered.", "Rare — and you'll know it when it's real.", "Pushback is information. Your job is to work out which kind it is before you decide how to respond."]}, {"number": 3, "title": "Not every “no” is the same", "blocks": ["READ IT FIRST", "The objections we hear most, sorted by what they're actually telling you.", "ABOUT THE OFFER", "ABOUT THE MOMENT", "ABOUT THE PERSON", "“Our software works just fine.”", "“I don't have time for sales calls.”", "“I'm not the one who buys software.”", "“It's too expensive.”", "“Just send me some info.”", "“They're not here.”", "“We don't have the bandwidth to switch.”", "“Not a priority right now.”", "“I've migrated before — nightmare.”", "“Bad timing.”", "A real objection. It tells you what they'd need answered.", "A brush-off. It tells you nothing — except that you haven't earned attention yet.", "Neither. It's routing — change who you're talking to, not what you're saying.", "A brush-off means go back and earn attention. An objection means answer the thing they raised. They are not the same move.", "These are the objections our own training lists. The sorting is a way to read them — not an official category."]}, {"number": 4, "title": "The biggest mistake is answering too fast", "blocks": ["THE INSTINCT TO BREAK", "Nobody loses a call by pausing for a second. Plenty lose one by rushing.", "WHAT USUALLY HAPPENS", "WHAT WE WANT INSTEAD", "Prospect pushes back", "Hear it", "Rep panics", "Understand it", "Rep starts pitching", "Respond with intention", "The pitch answers a question they didn't ask.", "You're answering what they actually said.", "The framework exists partly to give your brain time to react.", "The goal isn't the fastest rebuttal. It's understanding what the prospect actually meant."]}, {"number": 5, "title": "Acknowledge → Disarm → Add Value → Ask", "blocks": ["THE MOMENCE FRAMEWORK", "ACKNOWLEDGE", "DISARM", "ADD VALUE", "ASK", "Active listening.", "Break the buyer script.", "The reason you're still here.", "Keep the conversation going.", "Show them you heard and understood.", "Lower the guard they came in with.", "Give them something relevant to continue for.", "Give it somewhere to go.", "WHAT THE FRAMEWORK IS FOR", "Control the flow of the conversation", "Elicit objections you're comfortable handling", "Tee yourself up for the meeting", "Give your brain time to react", "Four words. Memorize these, not the sentences that come out of them."]}, {"number": 6, "title": "Show them you actually heard it", "blocks": ["STEP 1  ·  ACKNOWLEDGE", "Function: active listening.", "What's the easiest way to get someone to like you?", "Get them talking about themselves —\nand show genuine interest.", "SOMETIMES IT'S LITERAL", "SOMETIMES IT'S DEEPER", "Repeat what they said back to them — and sometimes ask them to confirm it.", "With the talkative ones, listen for the pain underneath what they're telling you.", "WHAT IT CAN SOUND LIKE", "“Glad to hear things have been going well with ______.”", "“Wow, I'm sorry to hear that's been your experience with them.”", "Examples of the pattern — not lines to memorize. Where you can, turn it into a positive."]}, {"number": 7, "title": "Break the buyer script", "blocks": ["STEP 2  ·  DISARM", "Function: lower the guard they answered the phone with.", "WHAT THEY'RE BRACED FOR", "WHAT DISARMING DOES", "You're going to argue with them.", "Agrees with them instead of fighting.", "You're going to push for a switch.", "Removes the pressure they expected.", "You're going to keep going until they're rude.", "Makes the next sentence worth hearing.", "That expectation is the guard.", "Nothing to push against.", "WHAT IT CAN SOUND LIKE", "“Happy to hear things are going well.”", "“I'm not looking to uproot your current set-up.”", "Remove the pressure before you try to create interest. A prospect who isn't defending anything can hear what you say next."]}, {"number": 8, "title": "Give them a reason to keep going", "blocks": ["STEP 3  ·  ADD VALUE", "Function: the reason why you're continuing to push.", "WHAT THEY SAID", "WHAT MIGHT MATTER", "RELEVANT VALUE", "TWO WAYS TO DO IT", "Ask a question about the value", "Give the reason you called", "“How much time do you usually spend responding to client questions and requests each week?”", "“The reason I'm calling is…” — one relevant thing, tied to what they just told you.", "Adding value usually isn't a product drop — it's hearing their pain, saying one thing about how we help, and moving toward the meeting.", "Use their objection as the reason they should take the call. Responsively — not reactively."]}, {"number": 9, "title": "Give the conversation somewhere to go", "blocks": ["STEP 4  ·  ASK", "Function: keep the conversation going.", "Every time you finish speaking — ask.", "TWO TYPES OF QUESTION", "ASK FOR MORE INFORMATION", "ASK FOR THE MEETING", "When you still don't understand what's really going on, or the objection was vague.", "When you've already got a legitimate reason for a second conversation. Push it.", "A question also prevents the awkward pause. Silence after a great response is where a call quietly dies.", "Don't deliver a great response and then leave the conversation hanging."]}, {"number": 10, "title": "How it sounds as one conversation", "blocks": ["ONE OBJECTION, ALL FOUR STEPS", "Not four robotic sentences — one natural response.", "PROSPECT", "“Our software works just fine.”", "“Glad to hear it's been working well for you.”", "ACKNOWLEDGE", "“I'm not looking to uproot what you've got set up.”", "DISARM", "“The reason I'm calling is what happens around the software — the follow-up and client messaging that usually still gets done by hand.”", "ADD VALUE", "“How much time do you usually spend responding to client questions and requests each week?”", "ASK", "Said out loud it's about eight seconds. It shouldn't sound like four steps — it should sound like a person."]}, {"number": 11, "title": "The framework holds. The words don't.", "blocks": ["SAME OBJECTION, DIFFERENT RESPONSE", "Same four words from the prospect — two different calls.", "“Our software works just fine.”", "YOU KNOW THEY'RE ON MINDBODY", "THEY JUST MENTIONED A SECOND INSTRUCTOR", "WHAT YOU'VE GOT", "WHAT YOU'VE GOT", "From pre-vetting: 14 weekly classes, one location.", "From earlier in this call — they're growing.", "SO ADD VALUE HERE", "SO ADD VALUE HERE", "Add value around the admin that sits on top of the scheduling.", "Add value around managing more staff and more schedules.", "“How much time goes into client questions each week?”", "“How are you handling the extra scheduling right now?”", "Memorize the framework. Not the response. Acknowledge and disarm barely changed — value and ask changed completely."]}, {"number": 12, "title": "Redirect, don't debate", "blocks": ["THE POSTURE", "You are not trying to prove them wrong.", "NEVER THIS", "PROSPECT:  “We're happy with our current software.”", "SDR:  “No you're not, and here's why Momence is better.”", "WHAT YOU'RE ACTUALLY DOING", "Acknowledge their position", "Lower resistance", "Create a reason to explore", "Move it forward", "The goal isn't to win the argument. It's to reopen the conversation."]}, {"number": 13, "title": "Know when to keep going", "blocks": ["JUDGMENT", "Handling objections doesn't mean refusing to take no for an answer.", "WORTH EXPLORING", "TIME TO STOP", "They're still talking to you.", "They ask you not to call again.", "They gave you a reason, not just a refusal.", "They've said no clearly, more than once.", "The objection is about the offer — you can answer it.", "You're the only one still in the conversation.", "Keep going. Politely.", "Log it honestly and move on.", "A “no” you log honestly comes back to you.", "Not interested goes to Nurture and returns as Recycled in three months. A do-not-call goes to Dead and stays there. A “no” you argue with is gone either way.", "Persistence requires judgment. Elicit the objections you're comfortable handling — don't fight every one you hear."]}, {"number": 14, "title": "Build the response, out loud", "blocks": ["OBJECTION LAB", "You'll get a real objection. Build all four steps before anyone gives you an answer.", "“Our software works just fine.”", "“I'm not the person that buys software.”", "“I don't have time for sales calls.”", "“We don't have the bandwidth to switch.”", "“It's too expensive.”", "“I've migrated before — it was a nightmare.”", "THEN WE TALK ABOUT WHY", "Why that acknowledgement?", "How did you lower resistance?", "What value, and why that one?", "What did you ask next?", "There's no answer key. Two reps can handle the same objection completely differently and both be right."]}, {"number": 15, "title": "Partner role play", "blocks": ["PRACTICE", "Build it up in three rounds. Stay conversational.", "ROUND 1", "ROUND 2", "ROUND 3", "Isolated objections", "Multiple objections", "A full cold call", "One objection at a time. Just get the four steps into your mouth.", "They push back twice. Handle it without repeating yourself.", "Objections appear where they naturally would. Run the whole thing.", "SUCCESS LOOKS LIKE", "SUCCESS ISN'T", "Navigating the conversation using the framework — and still sounding like yourself.", "Getting the wording right. Nobody is scoring you on exact sentences.", "If it starts sounding rehearsed, stop and say it again like you'd say it to a friend."]}, {"number": 16, "title": "Four things, in order", "blocks": ["DAY 6 TAKEAWAY", "LISTEN.", "LOWER RESISTANCE.", "CREATE RELEVANCE.", "ASK.", "WHICH IS THE FRAMEWORK", "ACKNOWLEDGE", "DISARM", "ADD VALUE", "ASK", "You don't control the conversation by talking more.", "You control it by listening, lowering resistance, creating relevance, and knowing what to ask next."]}, {"number": 17, "title": "Working Smarter at Scale", "blocks": ["TOMORROW", "WHAT WE'LL COVER", "PRIORITIZE", "SEGMENT", "YOU CAN NOW", "CHOOSE THE RIGHT OUTREACH", "Research prospects.", "EXECUTE", "Create relevance.", "Cold call.", "ANALYZE", "Navigate resistance.", "ADJUST", "So how do you do all of that across a whole Book of Business?", "Preview only — we teach it tomorrow."]}], "videos": [], "source": "resources/onboarding-day-6.pptx", "slides": [{"src": "slides/day-06-slide-01.jpg", "thumb": "slides/day-06-slide-01-thumb.jpg", "title": "Controlling the Conversation"}, {"src": "slides/day-06-slide-02.jpg", "thumb": "slides/day-06-slide-02-thumb.jpg", "title": "Why prospects push back"}, {"src": "slides/day-06-slide-03.jpg", "thumb": "slides/day-06-slide-03-thumb.jpg", "title": "Not every “no” is the same"}, {"src": "slides/day-06-slide-04.jpg", "thumb": "slides/day-06-slide-04-thumb.jpg", "title": "The biggest mistake is answering too fast"}, {"src": "slides/day-06-slide-05.jp
